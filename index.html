<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="theme-color" content="#ffffff">
<title>背单词</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* =========================================================================
   背单词 · 设计系统
   基底：近白纸面，黑与绿从四角渗入，巨型螺旋球线稿（品牌标记）作为纹理
   表层：两级毛玻璃 —— chrome 更通透，内容面板更实，保证长文可读
   字体：英文衬线 / 中文苹方 / 数据等宽，对应本 app 的三类信息
   规则：主题差异一律走 token，禁止 html[data-theme] 覆盖具体组件（会打乱优先级）
   ========================================================================= */
:root{
  /* —— 品牌 —— */
  --ink:#111111;
  --green:#1B8A3D;        /* 品牌绿：色块、填充、进度环一律用它 */
  --green-text:#177C34;   /* 小号绿字专用，仅比品牌绿深一档以过 4.5 */
  --paper:#FBFBFA;
  --on-green:#ffffff;

  /* —— 文字层级 —— */
  --fg:var(--ink);
  --fg-muted:rgba(17,17,17,.68);   /* 正文次级：翻译、讲解、meta   ≈5.9 */
  --fg-subtle:rgba(17,17,17,.62);  /* 小标签：eyebrow、n-label 等  ≈4.8 */
  --fg-faint:rgba(17,17,17,.34);   /* 纯装饰：chevron、等号、轨道           */

  /* —— 描边 —— */
  --line:rgba(17,17,17,.09);
  --line-strong:rgba(17,17,17,.16);
  --ring:rgba(27,138,61,.50);

  /* —— 玻璃 —— */
  --glass:rgba(255,255,255,.86);        /* 内容面板：读正文的地方 */
  --glass-chrome:rgba(251,251,250,.72); /* 顶栏底栏：内容从下面滑过 */
  --glass-sunk:rgba(17,17,17,.045);     /* 内嵌凹槽：讲解块、分段控件轨道 */
  --glass-edge:rgba(255,255,255,.75);   /* 玻璃上沿的高光发丝线 */
  --blur:24px;
  --blur-chrome:30px;

  /* —— 绿色语义 —— */
  --green-wash:rgba(27,138,61,.08);
  --green-line:rgba(27,138,61,.28);

  --danger:#B3261E;
  --danger-wash:rgba(179,38,30,.08);

  /* —— 形状与投影 —— */
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --shadow-1:0 1px 2px rgba(17,17,17,.05);
  --shadow-2:0 6px 20px -8px rgba(17,17,17,.16), 0 1px 3px rgba(17,17,17,.05);

  /* —— 字体 —— */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono",monospace;
  --fs:1;

  --bloom-green:rgba(27,138,61,.30);
  --bloom-ink:rgba(17,17,17,.30);
  color-scheme:light;
}
html[data-theme="dark"]{
  --ink:#F2F3F2;
  --green:#40B968;
  --green-text:#40B968;   /* 深色底上品牌绿已达 7.6，无需另设 */
  --paper:#0D0E0F;
  --on-green:#0D0E0F;

  --fg-muted:rgba(242,243,242,.72);
  --fg-subtle:rgba(242,243,242,.66);
  --fg-faint:rgba(242,243,242,.30);

  --line:rgba(242,243,242,.11);
  --line-strong:rgba(242,243,242,.18);
  --ring:rgba(64,185,104,.55);

  --glass:rgba(28,30,31,.84);
  --glass-chrome:rgba(18,19,20,.72);
  --glass-sunk:rgba(242,243,242,.055);
  --glass-edge:rgba(242,243,242,.08);

  --green-wash:rgba(64,185,104,.13);
  --green-line:rgba(64,185,104,.34);

  --danger:#FF6B61;
  --danger-wash:rgba(255,107,97,.10);

  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 8px 24px -10px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.35);

  --bloom-green:rgba(64,185,104,.26);
  --bloom-ink:rgba(0,0,0,.85);      /* 深色底上「黑」要比底色更黑才看得见 */
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);min-height:100%}
body{
  margin:0;min-height:100%;
  color:var(--fg);
  font-family:var(--sans);
  font-size:calc(17px * var(--fs));
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  background:transparent;
}

/* ——— 基底：四角渗入的黑与绿 ——— */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    /* 上边缘整条绿，下边缘整条黑，中间留白给正文 */
    linear-gradient(to bottom, var(--bloom-green) 0%, transparent 28%),
    linear-gradient(to top,    var(--bloom-ink)   0%, transparent 28%);
}

#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:where(button,a,input,textarea,label.btn,.gcell,.listitem,.rowbtn):focus-visible{
  outline:2px solid var(--ring);outline-offset:2px;
}

/* ============================ chrome ============================ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--glass-chrome);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  padding:max(env(safe-area-inset-top),8px) 16px 10px;
  display:flex;align-items:center;gap:12px;min-height:52px;
}
.topbar h1{
  font-size:calc(17px*var(--fs));font-weight:640;margin:0;flex:1;
  letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px;
}
.topbar .sub{
  font-family:var(--mono);font-size:calc(11.5px*var(--fs));font-weight:500;
  color:var(--fg-subtle);letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.iconbtn{
  min-width:44px;min-height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);font-size:calc(14.5px*var(--fs));font-weight:500;
  color:var(--fg-muted);margin:0 -8px;padding:0 8px;
  transition:background .15s,color .15s;
}
.iconbtn:active{background:var(--glass-sunk);color:var(--fg)}
.iconbtn.accent{color:var(--green-text);font-weight:600}

main{
  flex:1;padding:22px 16px calc(40px + env(safe-area-inset-bottom));
  max-width:840px;width:100%;margin:0 auto;
}
.view{display:none}
.view.on{display:block}

/* ============================ 面板 ============================ */
.card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:16px 18px;margin-bottom:14px;
}
.card.flat{background:var(--glass-sunk);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

.rowbtn{
  width:100%;text-align:left;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:15px 18px;margin-bottom:11px;
  display:flex;align-items:center;gap:14px;
  transition:transform .13s cubic-bezier(.2,.8,.3,1), box-shadow .13s, border-color .13s;
}
.rowbtn:active{transform:scale(.988);box-shadow:none;border-color:var(--line-strong)}
.rowbtn[disabled]{opacity:.5}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .chev{color:var(--fg-faint);font-size:calc(19px*var(--fs));line-height:1}
.rowbtn.locked{
  background:none;border-style:dashed;border-color:var(--line-strong);
  box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
}

.eyebrow{
  font-size:calc(11px*var(--fs));letter-spacing:.14em;
  color:var(--fg-subtle);font-weight:600;margin:28px 2px 11px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:0}

.title{font-size:calc(16.5px*var(--fs));font-weight:640;letter-spacing:-.005em}
.meta{font-size:calc(13px*var(--fs));color:var(--fg-muted);margin-top:3px;font-variant-numeric:tabular-nums}
.big{font-size:calc(15px*var(--fs));font-weight:600;color:var(--green-text)}

/* ============================ 按钮 ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 22px;border-radius:var(--r-md);
  font-weight:620;font-size:calc(15.5px*var(--fs));letter-spacing:-.005em;
  width:100%;border:1px solid transparent;
  background:var(--green);color:var(--on-green);
  box-shadow:var(--shadow-1);
  transition:transform .12s cubic-bezier(.2,.8,.3,1), opacity .12s, background .15s;
}
.btn:active{transform:translateY(1px);opacity:.9}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{
  background:var(--glass);color:var(--fg);border-color:var(--line-strong);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
}
.btn.ghost:active{background:var(--glass-sunk)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.danger{background:var(--danger-wash);color:var(--danger);border-color:transparent}
.btn.danger:active{background:var(--danger-wash);opacity:.75}

.footerbar{
  position:sticky;bottom:0;margin-top:26px;
  background:var(--glass-chrome);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  border-top:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:11px;
}
.footerbar .btn{flex:1}
.markbtn{background:var(--glass);color:var(--fg);border-color:var(--line-strong)}
.markbtn.done{background:var(--green);color:var(--on-green);border-color:transparent}

/* ============================ 进度 ============================ */
.progressbar{height:3px;background:var(--glass-sunk);border-radius:2px;overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .3s cubic-bezier(.2,.8,.3,1)}
.navrow{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:4px}
.navrow button{
  color:var(--fg-subtle);font-size:calc(14px*var(--fs));padding:8px 4px;min-width:44px;
  border-radius:var(--r-sm);
}
.navrow button:active{color:var(--fg)}
.navrow button[disabled]{opacity:.3;pointer-events:none}
.navrow span{font-family:var(--mono);font-size:calc(11.5px*var(--fs));color:var(--fg-subtle);font-variant-numeric:tabular-nums}

/* 签名元素：螺旋进度环 —— 品牌标记本身用来表达「一组走完了多少」 */
.ring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line-strong)}
.ring .arc{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.3,1)}
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap b{
  position:absolute;font-family:var(--mono);font-size:calc(11px*var(--fs));
  font-weight:600;color:var(--fg-muted);font-variant-numeric:tabular-nums;
}

/* ============================ 词条 ============================ */
/* 阅读面板：长文必须有干净的底，不能直接压在底纹上 */
.sheet{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2), inset 0 1px 0 var(--glass-edge);
  padding:22px 22px 24px;
}
@media (max-width:520px){ .sheet{padding:18px 16px 20px;border-radius:var(--r-md)} }
.wordhead{display:flex;align-items:flex-start;gap:12px;margin:4px 0 24px}
.wordhead .w{
  font-family:var(--serif);font-weight:700;
  font-size:calc(45px*var(--fs));line-height:1.12;letter-spacing:-.022em;
  word-break:break-word;flex:1;
}
.spk{
  min-width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  color:var(--green);margin-top:10px;flex:none;transition:background .15s;
}
.spk svg{width:20px;height:20px}
.spk:active{background:var(--green-wash)}
.spk.sm{
  display:inline-flex;width:25px;min-width:25px;height:21px;border-radius:6px;
  vertical-align:-3px;margin:0 0 0 3px;color:var(--fg-faint);
}
.spk.sm svg{width:14px;height:14px}
.spk.sm:active{color:var(--green);background:var(--green-wash)}
/* 星标：用墨黑不用绿 —— 绿是「已掌握」，收藏夹装的恰恰是没掌握的词 */
.star{
  min-width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  color:var(--fg-faint);margin-top:10px;flex:none;transition:color .15s,background .15s,transform .15s;
}
.star svg{width:21px;height:21px}
.star:active{background:var(--glass-sunk);transform:scale(.9)}
.star.on{color:var(--ink)}
.listitem .star{min-width:32px;height:32px;margin:0;align-self:center}
.listitem .star svg{width:17px;height:17px}
.favmeta{
  font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--fg-subtle);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;
}

.sense{margin:0 0 26px}
.sense:last-child{margin-bottom:8px}
.snum{
  font-family:var(--serif);font-size:calc(18px*var(--fs));color:var(--green-text);
  font-weight:700;margin-right:3px;
}
.ex{
  font-family:var(--serif);font-size:calc(21px*var(--fs));line-height:1.58;
  color:var(--fg);margin:0 0 9px;letter-spacing:-.003em;
}
.ex .hl{color:var(--green);font-weight:700}
.tr{
  font-size:calc(15.5px*var(--fs));color:var(--fg-muted);line-height:1.66;
  margin:0 0 12px;padding-left:15px;border-left:2px solid var(--line);
}

/* ============================ 复习出题 ============================ */
.quizhead{margin-bottom:14px}
.tierchip{
  display:inline-block;font-family:var(--mono);font-size:calc(11px*var(--fs));
  font-weight:600;letter-spacing:.04em;color:var(--green-text);
  background:var(--green-wash);border-radius:999px;padding:4px 11px;
}
.qopts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.qopt{
  text-align:left;padding:14px 16px;border-radius:var(--r-md);
  border:1px solid var(--line-strong);background:var(--glass-sunk);
  font-size:calc(15px*var(--fs));color:var(--fg);line-height:1.5;
  transition:background .13s,border-color .13s,transform .1s;
}
.qopt:active{transform:scale(.988)}
.qopt.right{background:var(--green-wash);border-color:var(--green);color:var(--green-text);font-weight:600}
.qopt.wrong{background:var(--danger-wash);border-color:var(--danger);color:var(--danger)}
.qopt.dim{opacity:.4}
.l4input{
  flex:1;min-height:50px;padding:0 16px;border-radius:var(--r-md);
  border:1px solid var(--line-strong);background:var(--glass);
  font-size:calc(16px*var(--fs));color:var(--fg);
}
.l4input:focus{border-color:var(--green);outline:none}

.notes{background:var(--glass-sunk);border-radius:var(--r-md);padding:13px 15px;margin-top:11px}
.notes > *{margin:0}
.notes > * + *{margin-top:8px}
.n-label{font-size:calc(12.5px*var(--fs));color:var(--fg-subtle);font-weight:600}
.n-text{font-size:calc(14.5px*var(--fs));color:var(--fg-muted);line-height:1.64}
.n-en{font-family:var(--serif);font-size:calc(15.5px*var(--fs));color:var(--fg-muted);line-height:1.55}
.n-gloss{
  font-size:calc(13.5px*var(--fs));color:var(--fg-muted);
  padding-left:13px;border-left:2px solid var(--line);
}
.eq{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-radius:var(--r-sm);
  background:var(--green-wash);
  box-shadow:inset 3px 0 0 var(--green);
}
.eq .lhs{font-family:var(--serif);font-weight:700;color:var(--green-text);font-size:calc(15.5px*var(--fs))}
.eq .eqs{color:var(--fg-faint);font-size:calc(13px*var(--fs))}
.eq .rhs{color:var(--fg);font-size:calc(14.5px*var(--fs))}

.summary{margin-top:24px;padding-top:19px;border-top:1px solid var(--line)}

/* ============================ 统计 / 提示 ============================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:13px 10px;text-align:center;
}
.stat b{
  display:block;font-family:var(--mono);font-size:calc(23px*var(--fs));
  font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.stat span{font-size:calc(11.5px*var(--fs));color:var(--fg-muted)}
.stat.g b{color:var(--green-text)}

.banner{
  border:1px solid var(--green-line);background:var(--green-wash);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border-radius:var(--r-md);padding:12px 15px;margin-bottom:14px;
  font-size:calc(13.5px*var(--fs));display:flex;gap:12px;align-items:center;
}
.banner .grow{flex:1}
.banner button{color:var(--green-text);font-weight:620;white-space:nowrap;padding:6px 2px}
.hint{font-size:calc(13px*var(--fs));color:var(--fg-muted);line-height:1.6}
.hint.warn{color:var(--danger)}
.empty{text-align:center;color:var(--fg-subtle);padding:56px 20px;font-size:calc(15px*var(--fs))}

/* ============================ 组列表 ============================ */
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:8px 14px;border-radius:var(--r-sm);font-size:calc(13.5px*var(--fs));
  background:var(--glass-sunk);color:var(--fg-muted);white-space:nowrap;
  border:1px solid transparent;transition:background .15s,color .15s;
}
.tabs button.on{background:var(--ink);color:var(--paper);font-weight:620}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
/* 数量可达数千，这里不用 backdrop-filter，改用实色 tint —— 否则 iPad 上会卡 */
.gcell{
  aspect-ratio:1;border-radius:var(--r-md);
  background:var(--glass-sunk);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s;
}
.gcell:active{transform:scale(.94)}
.gcell b{
  font-family:var(--mono);font-size:calc(16px*var(--fs));font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.gcell span{font-family:var(--mono);font-size:calc(9.5px*var(--fs));color:var(--fg-subtle);letter-spacing:.04em}
.gcell.learning{border-color:var(--ink)}
.gcell.reviewing{background:var(--green-wash);border-color:var(--green-line)}
.gcell.reviewing b,.gcell.reviewing span{color:var(--green-text)}

.listitem{
  display:flex;align-items:baseline;gap:12px;padding:13px 4px;
  border-bottom:1px solid var(--line);border-radius:var(--r-sm);
  transition:background .13s;
}
.listitem:active{background:var(--glass-sunk)}

<body>
<div id="app">
  <div class="topbar">

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   背单词 · 单文件 PWA
   数据：IndexedDB(vocab_v1)  设置：localStorage
   ========================================================================= */

const GROUP_TARGET = 230;                   // 每批背诵目标义项数（可调），不是词数——
                                             // 词的信息量差到 14 倍（back 一词=14个普通词），
                                             // 按词数切组会让每天的负担忽大忽小
const GROUP_FLOOR_RATIO = 0.4;              // 批太小就宁可超过目标也不提前收尾
// 统一阶梯：每级同时决定复习间隔（天）和这一级允许的最高题型（1-4）。
// 答对：stage 前进一级；答错：stage 后退两级（下限 0）——间隔和题型一起变，
// 不再是两个独立旋钮。stage 7（90天）是终点：多义词答对后卡在这一级原地循环
// （见 MULTISENSE_STAGE_CAP），单义词达到这一级就等于「进入长期轮换」，
// 不需要另开一套「长期池」机制，它本来就是这张表的最后一格。
const LADDER      = [1, 2, 4, 7, 15, 30, 60, 90];   // 天
const LADDER_TIER = [1, 1, 2, 2, 3,  3,  4,  4];    // 每级允许的最高题型
const MULTISENSE_THRESHOLD = 12;   // ≥12 义项算「核心词」，反正考不全，不给毕业资格
const MULTISENSE_STAGE_CAP = 5;    // 核心词永远卡在这一级（30天/L3），不许升到 60/90天
const DAY_START  = 4;                       // 凌晨 4:00 为一天分界
const BACKUP_WARN_DAYS = 7;
const APP_VERSION = "2.0.0";

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function todayKey(d) {
  const t = d ? new Date(d) : new Date();
  t.setHours(t.getHours() - DAY_START);
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function addDays(key, n) {
  const [y,m,d] = key.split("-").map(Number);
  const t = new Date(y, m-1, d + n);
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function daysBetween(a, b) {
  const p = k => { const [y,m,d] = k.split("-").map(Number); return Date.UTC(y, m-1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; }
  return r;
}
function fmtSize(b) {
  return b > 1048576 ? (b / 1048576).toFixed(1) + " MB"
       : b > 1024    ? Math.round(b / 1024) + " KB" : b + " B";
}
// 大批量导入会阻塞几秒到十几秒，必须给反馈，否则看起来像卡死
let busyEl = null;
function busy(label, sub, pct) {
  if (label === false) { if (busyEl) busyEl.remove(); busyEl = null; return Promise.resolve(); }
  if (!busyEl) {
    busyEl = document.createElement("div");
    busyEl.className = "busy";
    busyEl.innerHTML = '<div class="box"><div class="lab"></div><div class="sub"></div>' +
                       '<div class="bar"><i style="width:0%"></i></div></div>';
    document.body.appendChild(busyEl);
  }
  busyEl.querySelector(".lab").textContent = label;
  busyEl.querySelector(".sub").textContent = sub || "";
  busyEl.querySelector(".bar i").style.width = Math.max(0, Math.min(100, pct || 0)) + "%";
  // 让出主线程，否则进度条不会重绘
  return new Promise(r => setTimeout(r, 0));
}
let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ------------------------------------------------------------------- db */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("vocab_v1", 3);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      let w;
      if (!d.objectStoreNames.contains("words")) {
        w = d.createObjectStore("words", { keyPath: "id" });
        w.createIndex("by_word", "wordKey", { unique: true });
        w.createIndex("by_group", "groupId");
      } else {
        w = e.target.transaction.objectStore("words");
      }
      if (!d.objectStoreNames.contains("groups")) d.createObjectStore("groups", { keyPath: "id" });
      if (!d.objectStoreNames.contains("meta"))   d.createObjectStore("meta", { keyPath: "k" });
      // v2：中文反查索引。单独建 store 是为了让扫描只读几十字节 / 条，
      // 而不是把 800 字节的完整词条全部反序列化一遍。
      if (!d.objectStoreNames.contains("zhidx"))  d.createObjectStore("zhidx", { keyPath: "id" });
      // v3：复习下沉到词级，需要按到期日范围查询——不能再靠常驻内存的
      // S.groups 扫一遍了，6 万词的量级必须走索引，不能全表扫描。
      // nextReviewDate 在没进复习前是 undefined（字段整个不写），
      // IndexedDB 索引会自动跳过没有该字段的记录，天然把待背/背诵中的词排除在外。
      if (!w.indexNames.contains("by_due")) w.createIndex("by_due", "nextReviewDate");
    };
    rq.onsuccess = e => { db = e.target.result; res(db); };
    rq.onerror = e => rej(e.target.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function tx(stores, mode) { return db.transaction(stores, mode); }
function store(name, mode = "readonly") { return tx([name], mode).objectStore(name); }

async function metaGet(k, dflt) {
  const r = await req(store("meta").get(k));
  return r === undefined ? dflt : r.v;
}
async function metaSet(k, v) {
  await req(store("meta", "readwrite").put({ k, v }));
}
async function getWords(ids) {
  const s = store("words");
  const out = await Promise.all(ids.map(id => req(s.get(id))));
  return out.filter(Boolean);
}
async function getWord(id) { return req(store("words").get(id)); }
async function putWord(w) { return req(store("words", "readwrite").put(w)); }

/* --------------------------------------------------------------- state */
const S = {
  groups: [],          // 全量组（数量级 2000，常驻内存）
  nextSeq: 1,          // 下一个词的 id / 全局序号
  looseIds: [],        // 暂存区（未成组）的词 id，按 seq 递增
  quota: null,         // {date, ids:[]}
  lastNewGroupDate: "",
  lastNewGroupId: null,   // 今天的新组额度被哪一组消耗了
  importLog: [],          // 每批导入的 id 区间，用于撤销（栈，只能从尾部弹）
  starredOrder: [],       // 收藏的词 id，数组顺序 = 收藏先后
  starred: new Set(),     // 同一份数据的查询视图
  lastBackup: "",
  settings: { theme: "auto", fs: 1, voice: "en-US", rate: 0.92 },
  view: "home",
  stack: [],
};

function loadSettings() {
  try { Object.assign(S.settings, JSON.parse(localStorage.getItem("vocab_settings") || "{}")); } catch (e) {}
  applySettings();
}
function saveSettings() {
  try { localStorage.setItem("vocab_settings", JSON.stringify(S.settings)); } catch (e) {}
  applySettings();
}
function applySettings() {
  const t = S.settings.theme;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name=theme-color]').setAttribute("content", dark ? "#0e0f10" : "#ffffff");
  document.documentElement.style.setProperty("--fs", S.settings.fs);
}

// 老数据升上来时索引是空的，补建一次。之后每次导入都同步写，不会再触发。
async function backfillZh() {
  const nWords = await req(store("words").count());
  const nIdx   = await req(store("zhidx").count());
  if (nWords === 0 || nIdx >= nWords) return 0;
  toast("正在建立中文检索索引…");
  let done = 0, batch = [];
  await new Promise((res, rej) => {
    const c = store("words").openCursor();
    c.onsuccess = e => {
      const cur = e.target.result;
      if (!cur) return res();
      batch.push({ id: cur.value.id, t: zhText(cur.value) });
      cur.continue();
    };
    c.onerror = () => rej(c.error);
  });
  for (let i = 0; i < batch.length; i += 500) {
    const t = tx(["zhidx"], "readwrite"), zs = t.objectStore("zhidx");
    batch.slice(i, i + 500).forEach(r => zs.put(r));
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    done += Math.min(500, batch.length - i);
  }
  return done;
}

async function loadState() {
  S.groups = await req(store("groups").getAll());
  S.groups.sort((a, b) => a.id - b.id);
  S.nextSeq = await metaGet("nextSeq", 1);
  S.looseIds = await metaGet("looseIds", []);
  S.lastNewGroupDate = await metaGet("lastNewGroupDate", "");
  S.lastNewGroupId = await metaGet("lastNewGroupId", null);
  S.importLog = await metaGet("importLog", []);
  S.starredOrder = await metaGet("starredIds", []);
  S.starred = new Set(S.starredOrder);
  S.lastBackup = await metaGet("lastBackup", "");
  await refreshQuota();
  const n = await backfillZh();
  if (n) toast("中文检索索引已建立（" + n + " 词）");
}
const groupById = id => S.groups.find(g => g.id === id);

/* ---------------------------------------------------- 复习调度 / 门禁（词级） */
// 今天到期的词——走 by_due 索引的范围查询，不扫全表。
// nextReviewDate 是 "YYYY-MM-DD" 字符串，字典序比较等价于日期比较。
function getDueWordIds(today) {
  return new Promise((res, rej) => {
    const ids = [];
    const idx = store("words").index("by_due");
    const rq = idx.openCursor(IDBKeyRange.upperBound(today));
    rq.onsuccess = e => {
      const c = e.target.result;
      if (!c) return res(ids);
      ids.push(c.value.id);
      c.continue();
    };
    rq.onerror = () => rej(rq.error);
  });
}
// 今日复习队列：不设硬上限（Q19裁定）——到期多少就是多少，2-3小时预算够用。
// 排序按到期日从旧到新：越拖欠越久的越先出现，这就是排优先级，不用额外打分。
async function refreshQuota() {
  const today = todayKey();
  let q = await metaGet("quota", null);
  if (!q || q.date !== today) {
    const words = await getWords(await getDueWordIds(today));
    words.sort((a, b) => a.nextReviewDate < b.nextReviewDate ? -1
                        : a.nextReviewDate > b.nextReviewDate ? 1 : a.id - b.id);
    q = { date: today, ids: words.map(w => w.id) };
    await metaSet("quota", q);
  }
  S.quota = q;
}
// 门禁：今天到期的词队列里还剩几个没答（答对答错都算「答过」，不缩水）
const gateOpen = () => S.quota.ids.length === 0;

const learningGroup = () => S.groups.find(g => g.state === "learning");
function canStartNewGroup() {
  if (!gateOpen()) return { ok: false, why: "gate" };
  if (learningGroup()) return { ok: false, why: "inprogress" };
  if (S.lastNewGroupDate === todayKey()) return { ok: false, why: "daily" };
  if (!S.groups.some(g => g.state === "pending")) return { ok: false, why: "empty" };
  return { ok: true };
}

/* ------------------------------------------------------------ 解析器 */
const NUMS = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺㊻㊼㊽㊾㊿❶❷❸❹❺❻❼❽❾❿⓫⓬⓭⓮⓯⓰⓱⓲⓳⓴⓵⓶⓷⓸⓹⓺⓻⓼⓽⓾";  // ①-㊿ 再接 ❶-❿ ⓫-⓴ ⓵-⓾ 共 80 个：set / go / take 这类核心词义项能到七八十个
const SUMMARY_RE = /^(所以|总之|总结|归纳|综上|因此|一个词|记住|词族|注意区别|对比|反义词|近义词)/;  // 只在最后一个例句之后、且其后不再出现新例句时才生效
const EQ_RE = /^([A-Za-z][A-Za-z0-9’'\-\s.]{0,44}?)\s*=\s*(.+)$/;

function classifyNote(line) {
  if (line.startsWith("=")) return { t: "gloss", text: line.slice(1).trim() };
  const m = line.match(EQ_RE);
  if (m && /[A-Za-z]/.test(m[1])) return { t: "eq", lhs: m[1].trim(), rhs: m[2].trim() };
  if (/[：:]$/.test(line) && line.length <= 24) return { t: "label", text: line };
  if (!/[一-鿿]/.test(line)) return { t: "en", text: line };
  return { t: "text", text: line };
}

function parseVocab(text) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  let cur = null;
  lines.forEach((raw, i) => {
    const t = raw.trim();
    if (!t) { if (cur) { blocks.push(cur); cur = null; } return; }
    if (!cur) cur = { start: i + 1, lines: [] };
    cur.lines.push({ n: i + 1, t });
  });
  if (cur) blocks.push(cur);

  return blocks.map(b => {
    const e = { word: "", senses: [], summary: [], head: [], issues: [], line: b.start,
                raw: b.lines.map(l => l.t).join("\n") };
    const first = b.lines[0].t;
    e.word = first;
    if (!/^[A-Za-z][A-Za-z0-9’'\-. ]*$/.test(first) || first.split(/\s+/).length > 4) {
      e.issues.push({ n: b.lines[0].n, msg: "首行不像单词：「" + first + "」" });
    }
    let sense = null, inSummary = false;
    for (let i = 1; i < b.lines.length; i++) {
      const { n, t } = b.lines[i];
      const idx = NUMS.indexOf(t[0]);
      if (idx >= 0) {
        sense = { no: idx + 1, example: t.slice(1).trim(), translation: "", notes: [] };
        e.senses.push(sense); inSummary = false; continue;
      }
      if (!inSummary && sense && SUMMARY_RE.test(t) && e.senses.length > 0) {
        const rest = b.lines.slice(i).map(l => l.t);
        // 仅当其后不再出现新例句时，才视为词尾总结
        if (!rest.some(x => NUMS.indexOf(x[0]) >= 0)) inSummary = true;
      }
      const note = classifyNote(t);
      if (inSummary) { e.summary.push(note); continue; }
      if (!sense) { e.head.push(note); continue; }
      if (note.t === "gloss" && !sense.translation) { sense.translation = note.text; continue; }
      sense.notes.push(note);
    }
    if (e.senses.length === 0) e.issues.push({ n: b.start, msg: "没有找到 ①②③ 例句" });
    e.senses.forEach(s => {
      if (!s.translation) e.issues.push({ n: b.start, msg: "例句 " + NUMS[s.no-1] + " 缺少以 = 开头的中文翻译" });
    });
    return e;
  }).filter(e => e.word);
}

/* ------------------------------------------------------ 复习调度：词级 */
// 「近义对照：」「注意别混：」「注意区别：」「反义词：」这几个标签块下面的
// 等式行点名的是邻居词，不是这个词自己——L2/L3 出干扰项就从这里取，
// 不用另建索引：邻居的短释义就写在这个词自己的笔记里，读它自己就够了。
const CONTRAST_LABEL_RE = /(对照|别混|区别|反义)/;
function firstToken(word) { return word.split(/\s|-/)[0].toLowerCase(); }

// 遍历一个词全部笔记（head + 每个义项 + summary），标出「当前是不是在对照块里」，
// 回调拿到 (note, inContrast, senseNo)。三处需要这个遍历：等式提取、邻居提取、核心块提取，
// 逻辑写一遍，不要三份。
function walkNotes(w, fn) {
  let inContrast = false;
  (w.head || []).forEach(n => {
    if (n.t === "label") inContrast = CONTRAST_LABEL_RE.test(n.text);
    fn(n, inContrast, 0);
  });
  (w.senses || []).forEach(s => {
    inContrast = false;
    (s.notes || []).forEach(n => {
      if (n.t === "label") { inContrast = CONTRAST_LABEL_RE.test(n.text); return; }
      fn(n, inContrast, s.no);
    });
  });
  inContrast = false;
  (w.summary || []).forEach(n => {
    if (n.t === "label") inContrast = CONTRAST_LABEL_RE.test(n.text);
    fn(n, inContrast, 0);
  });
}
// 每个义项自己的「等式行」——不在对照块里的第一条 eq，是这一支的词义标签，
// 也是机器判分的答案键。缺了的义项（还没回填等式行）不进 L1/L4 抽样池。
function senseGloss(w, sense) {
  let g = null;
  (sense.notes || []).forEach(n => {
    if (g) return;
    if (n.t === "label" && CONTRAST_LABEL_RE.test(n.text)) { g = false; return; } // 提前进对照块，后面不再找
    if (g === false) return;
    if (n.t === "eq") g = n.rhs;
  });
  return g || null;
}
// 对照块里点名的邻居词：{lhs（邻居词头）, rhs（邻居的短释义）}，排除词头本身。
function contrastNeighbors(w) {
  const out = [], self = firstToken(w.word);
  walkNotes(w, (n, inContrast) => {
    if (inContrast && n.t === "eq" && firstToken(n.lhs) !== self) out.push({ lhs: n.lhs, rhs: n.rhs });
  });
  return out;
}
// 核心块：word.head 里能读的文字，遮住词头本身（34% 的核心块里写了词头，
// 直接当 L3 选项会当场泄题）。
function coreText(w) {
  const parts = (w.head || []).filter(n => n.t !== "label" && n.t !== "eq").map(n => n.text);
  let t = parts.join(" ");
  try {
    const re = new RegExp("\\b" + firstToken(w.word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]{0,8}\\b", "gi");
    t = t.replace(re, "该词");
  } catch (e) {}
  return t;
}
function senseCount(w) { return (w.senses || []).length; }
function stageCap(w) { return senseCount(w) >= MULTISENSE_THRESHOLD ? MULTISENSE_STAGE_CAP : LADDER.length - 1; }
function tierOf(w) { return LADDER_TIER[Math.min(w.reviewStage || 0, LADDER.length - 1)]; }

// 答对：stage 前进一级（多义词卡在 MULTISENSE_STAGE_CAP，不许再往上）。
// 答错：stage 后退两级，下限 0——这一步顺带保证了「当天不再考」：
// 退到 0 时 LADDER[0]=1 天，最快也是明天才会再出现，不需要另外记「今天问过了」。
function scheduleWord(w, correct) {
  const cap = stageCap(w);
  const cur = w.reviewStage || 0;
  w.reviewStage = correct ? Math.min(cur + 1, cap) : Math.max(cur - 2, 0);
  w.nextReviewDate = addDays(todayKey(), LADDER[w.reviewStage]);
  if (!correct) w.forgotCount = (w.forgotCount || 0) + 1;
}

/* ------------------------------------------------------ 中文反查索引 */
// 只收「词义」类文本：等式行右侧、= 开头的释义、例句翻译。
// 不收整段讲解 —— 那会让索引膨胀几倍，扫描变慢，而搜的人记得的是词义。
function zhText(w) {
  const out = [];
  const push = n => {
    if (n.t === "eq") out.push(n.rhs);
    else if (n.t === "gloss") out.push(n.text);
  };
  (w.head || []).forEach(push);
  (w.senses || []).forEach(s => { if (s.translation) out.push(s.translation); (s.notes || []).forEach(push); });
  (w.summary || []).forEach(push);
  return out.join(" ").replace(/\s+/g, " ").slice(0, 200);
}
const HAS_CJK = /[\u4e00-\u9fff\u3400-\u4dbf]/;

/* -------------------------------------------------------- 高亮目标词 */
const SUFFIX_RE = /(ations?|ators?|ments?|nesses?|ities|ives?|ables?|ibles?|ances?|ences?|ings?|ers?|ors?|ies|ed|es|s|ly|y|e)$/;
function hlRegex(word) {
  const w = word.toLowerCase().split(/\s|-/)[0];
  let stem = w;
  const st = w.replace(SUFFIX_RE, "");
  if (st.length >= 5) stem = st;
  return new RegExp("\\b(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]{0,6})\\b", "gi");
}
function hl(sentence, word) {
  const out = esc(sentence);
  try { return out.replace(hlRegex(word), '<span class="hl">$1</span>'); }
  catch (e) { return out; }
}

/* ---------------------------------------------------------- 词条渲染 */
const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>';
// 签名元素：把 logo 的螺旋球画成进度环。done/total 是真实的组进度。
function ring(done, total, label) {
  const R = 19, C = 2 * Math.PI * R;
  const pct = total ? Math.max(0, Math.min(1, done / total)) : 0;
  return '<span class="ringwrap">' +
    '<svg class="ring" viewBox="0 0 44 44" aria-hidden="true">' +
      '<circle class="trk" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="2.5"/>' +
      '<circle class="arc" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="2.5" ' +
        'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/>' +
    "</svg>" +
    "<b>" + esc(label != null ? label : done) + "</b></span>";
}
const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 3.1l2.63 5.33 5.87.86-4.25 4.14 1 5.85L12 16.52 6.75 19.28l1-5.85L3.5 9.29l5.87-.86z"/></svg>';
function starBtn(id, size) {
  const on = S.starred.has(id);
  return '<button class="star' + (on ? " on" : "") + '" data-star="' + id + '"' +
    ' aria-label="' + (on ? "取消收藏" : "收藏") + '" aria-pressed="' + on + '">' +
    STAR_SVG.replace("<svg", '<svg fill="' + (on ? "currentColor" : "none") +
                     '" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"') + "</button>";
}
async function toggleStar(id) {
  id = +id;
  if (S.starred.has(id)) {
    S.starred.delete(id);
    S.starredOrder = S.starredOrder.filter(x => x !== id);
    toast("已取消收藏");
  } else {
    S.starred.add(id);
    S.starredOrder.push(id);          // 数组顺序即收藏先后，不需要时间戳
    toast("已加入收藏夹");
  }
  await metaSet("starredIds", S.starredOrder);
  document.querySelectorAll('[data-star="' + id + '"]').forEach(b => {
    b.outerHTML = starBtn(id);
  });
  if (S.view === "fav") RENDER.fav();
}
window.toggleStar = toggleStar;
function spkBtn(text, kind) {
  return '<button class="spk' + (kind === "inline" ? " sm" : "") + '" data-say="' + esc(text) + '" aria-label="朗读">' + SPK_SVG + "</button>";
}
function renderNotes(notes) {
  if (!notes.length) return "";
  return '<div class="notes">' + notes.map(n => {
    if (n.t === "eq")    return '<div class="eq"><span class="lhs">' + esc(n.lhs) + '</span><span class="eqs">=</span><span class="rhs">' + esc(n.rhs) + "</span></div>";
    if (n.t === "gloss") return '<div class="n-gloss">' + esc(n.text) + "</div>";
    if (n.t === "label") return '<div class="n-label">' + esc(n.text) + "</div>";
    if (n.t === "en")    return '<div class="n-en">' + esc(n.text) + "</div>";
    return '<div class="n-text">' + esc(n.text) + "</div>";
  }).join("") + "</div>";
}
function renderWordFull(w) {
  // w.id 为空 = 导入预览里还没入库的词条，不显示星标
  let h = '<div class="wordhead"><div class="w">' + esc(w.word) + "</div>" +
          (w.id != null ? starBtn(w.id) : "") + spkBtn(w.word, "") + "</div>";
  if (w.head && w.head.length) h += renderNotes(w.head);
  w.senses.forEach(s => {
    h += '<div class="sense">' +
         '<p class="ex"><span class="snum">' + NUMS[s.no-1] + "</span> " + hl(s.example, w.word) +
         " " + spkBtn(s.example, "inline") + "</p>" +
         (s.translation ? '<p class="tr">' + esc(s.translation) + "</p>" : "") +
         renderNotes(s.notes) +
         "</div>";
  });
  if (w.summary && w.summary.length) h += '<div class="summary">' + renderNotes(w.summary) + "</div>";
  return h;
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.settings.voice || "en-US";
    u.rate = S.settings.rate || 0.92;
    const v = speechSynthesis.getVoices().find(x => x.lang === u.lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast("此设备不支持朗读"); }
}
window.speak = speak;
document.addEventListener("click", e => {
  if (!e.target.closest) return;
  const say = e.target.closest("[data-say]");
  if (say) { e.preventDefault(); speak(say.dataset.say); return; }
  const set = e.target.closest("[data-set]");
  if (set) { setSetting(set.dataset.set, set.dataset.num ? parseFloat(set.dataset.val) : set.dataset.val); return; }
  const st = e.target.closest("[data-star]");
  if (st) { e.preventDefault(); e.stopPropagation(); toggleStar(st.dataset.star); }
});

/* ---------------------------------------------------------- 导航外壳 */
function go(view, push = true) {
  if (push && S.view !== view) S.stack.push(S.view);
  S.view = view;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#v-" + view).classList.add("on");
  $("#backBtn").style.display = view === "home" ? "none" : "flex";
  window.scrollTo(0, 0);
  RENDER[view]();
}
function back() {
  const prev = S.stack.pop() || "home";
  go(prev, false);
}
$("#backBtn").onclick = back;
function setTitle(t, sub) {
  $("#ttl").innerHTML = esc(t) + (sub ? ' <span class="sub">' + esc(sub) + "</span>" : "");
}
function setAction(label, fn, accent) {
  const b = $("#actBtn");
  if (!label) { b.style.display = "none"; b.onclick = null; return; }
  b.style.display = "flex"; b.textContent = label; b.onclick = fn;
  b.className = "iconbtn" + (accent ? " accent" : "");
}

  } else {
    h += '<button class="rowbtn" style="background:var(--green-wash);border-color:var(--green-line)" onclick="startReview()">' +

    } else {

  } else if (canNew.ok) {

    h += '<button class="rowbtn" onclick="startLearn(' + next.id + ')"><div class="grow">' +
         '<div class="title">开始新的一组 · 组 #' + next.id + "</div>" +

  } else {

      empty: "词库里没有待背的完整组了",
    }[canNew.why] || "";
    const sub = {

    }[canNew.why] || "";
    h += '<div class="rowbtn locked"><div class="grow"><div class="title" style="color:var(--fg-muted)">' + msg + "</div>" +

/* ============================== 背诵 ============================== */
let LS = null;   // {group, words, idx}
async function startLearn(gid) {
  const g = groupById(gid);
  if (!gateOpen()) { toast("今日复习未完成，背诵已锁定"); return; }
  if (g.state === "pending") {
    if (!canStartNewGroup().ok) { toast("今天已经开过新的一组了"); return; }
    g.state = "learning"; g.startedAt = todayKey(); g.learnSession = { idx: 0 };
    S.lastNewGroupDate = todayKey();
    S.lastNewGroupId = g.id;
    await metaSet("lastNewGroupDate", S.lastNewGroupDate);
    await metaSet("lastNewGroupId", S.lastNewGroupId);
    await req(store("groups", "readwrite").put(g));
  }
  const words = await getWords(g.wordIds);
  LS = { group: g, words, idx: (g.learnSession && g.learnSession.idx) || 0 };
  if (LS.idx >= words.length) LS.idx = 0;
  go("learn");
}
window.startLearn = startLearn;

RENDER.learn = function () {
  if (!LS) { go("home", false); return; }
  const { group: g, words, idx } = LS;
  const w = words[idx];
  setTitle("组 #" + g.id, (idx + 1) + " / " + words.length);
  setAction("列表", () => openGroup(g.id));

  let h = '<div class="navrow">' +
    '<button onclick="learnStep(-1)"' + (idx === 0 ? " disabled" : "") + ">‹ 上一个</button>" +
    '<span>已标记 ' + g.learnedCount + "/" + words.length + "</span>" +
    '<button onclick="learnStep(1)"' + (idx === words.length - 1 ? " disabled" : "") + ">下一个 ›</button></div>" +
    '<div class="progressbar" style="margin-bottom:22px"><i style="width:' + (g.learnedCount / words.length * 100) + '%"></i></div>' +
    '<div class="sheet" id="cardhost">' + renderWordFull(w) + "</div>" +
    '<div class="footerbar">' +
    '<button class="btn markbtn' + (w.learned ? " done" : "") + '" onclick="toggleMark()">' +
      (w.learned ? "✓ 已背下" : "标记为已背下") + "</button></div>";
  $("#v-learn").innerHTML = h;
};

function learnStep(d) {
  const n = LS.idx + d;
  if (n < 0 || n >= LS.words.length) return;
  LS.idx = n;
  LS.group.learnSession = { idx: n };
  req(store("groups", "readwrite").put(LS.group));
  RENDER.learn();
}
window.learnStep = learnStep;

async function toggleMark() {
  const w = LS.words[LS.idx], g = LS.group;
  w.learned = !w.learned;
  w.learnedAt = w.learned ? todayKey() : null;
  await putWord(w);
  g.learnedCount = LS.words.filter(x => x.learned).length;

  if (g.learnedCount === g.wordIds.length && g.state === "learning") {
    g.state = "reviewing";
    g.completedAt = todayKey();
    g.learnSession = null;
    // 复习状态下沉到词——每个词各自起步于 stage 0，不再是整组共用一个进度。
    const firstDue = addDays(g.completedAt, LADDER[0]);
    const t = tx(["words", "groups"], "readwrite");
    const ws = t.objectStore("words");
    LS.words.forEach(x => {
      x.reviewStage = 0;
      x.nextReviewDate = firstDue;
      ws.put(x);
    });
    t.objectStore("groups").put(g);
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    await refreshQuota();
    $("#v-learn").innerHTML =
      '<div class="empty" style="padding-top:64px"><div style="font-size:3em;line-height:1.4">✓</div>' +
      '<div style="color:var(--green-text);font-weight:600;font-size:1.25em;margin-bottom:8px">组 #' + g.id + " 已背诵完成</div>" +
      "<div>" + g.wordIds.length + " 个词全部标记完毕<br>已加入复习清单，下次复习：" + firstDue + "</div></div>" +
      '<button class="btn" onclick="go(\'home\',false)">回到首页</button>';
    setAction("");
    LS = null;
    return;
  }
  await req(store("groups", "readwrite").put(g));
  // 标记后自动前进
  if (w.learned && LS.idx < LS.words.length - 1) { learnStep(1); return; }
  RENDER.learn();
}
window.toggleMark = toggleMark;

/* ============================== 复习（词级） ============================== */
// 会话不再挂在某个组上：今天到期的词是什么，会话就是什么。
// S.quota.ids 是唯一的进度存档——每答一题就从里面摘掉一个并持久化，
// 中途退出、下次进来会自动接着剩下的答，不需要另存一份 session 结构。
let RS = null;   // {pool:[word], queue:[word], idx, cur:question, revealed}

async function startReview() {
  if (!S.quota.ids.length) { toast("今天没有到期的复习"); go("home", false); return; }
  const words = await getWords(S.quota.ids);

async function loadQuestion() {
  if (!RS || RS.idx >= RS.queue.length) { return finishSession(); }

  RS.revealed = false;
  RS.picked = null;

/* ---- 出题：四档题型 + 兜底，取数据不够时逐级降级，L3/自评兜底 100% 出得了题 ---- */
async function genQuestion(w, pool) {
  const tier = tierOf(w);
  let q = null;
  if (tier === 1) q = genMeaningMC(w, false);
  else if (tier === 2) q = genMeaningMC(w, true);
  else if (tier === 4) q = genProduce(w);
  if (!q) q = await genCoreMC(w, pool);
  if (!q) q = genSelfReport(w);
  return q;
}
// L1「认支线」/ L2「辨邻居」：给例句，从等式行选这一支的意思。
// L1 干扰项取本词其余义项；L2 优先取对照块里点名的邻居词，不够再退回本词其余义项。
function genMeaningMC(w, preferContrast) {
  const usable = (w.senses || []).map(s => ({ s, g: senseGloss(w, s) })).filter(x => x.g);
  if (!usable.length) return null;
  const pick = usable[Math.floor(Math.random() * usable.length)];
  const correct = pick.g;
  let poolTexts = preferContrast ? contrastNeighbors(w).map(n => n.rhs) : [];
  if (poolTexts.length < 3) poolTexts = poolTexts.concat(usable.filter(x => x !== pick).map(x => x.g));
  if (poolTexts.length < 3) poolTexts = poolTexts.concat(contrastNeighbors(w).map(n => n.rhs));
  poolTexts = Array.from(new Set(poolTexts.filter(t => t !== correct)));
  const options = shuffle([correct, ...shuffle(poolTexts).slice(0, 3)]);
  if (options.length < 2) return null;
  return { type: "mc", word: w, tier: preferContrast ? 2 : 1,
           prompt: pick.s.example, options, answerIndex: options.indexOf(correct) };
}
// L4「反向产出」：给中文释义 + 首字母，打出词头本身（不是整条搭配短语）。
function genProduce(w) {
  const usable = (w.senses || []).map(s => senseGloss(w, s)).filter(Boolean);
  if (!usable.length) return null;
  const gloss = usable[Math.floor(Math.random() * usable.length)];
  const head = firstToken(w.word);
  return { type: "type", word: w, tier: 4, prompt: gloss, firstLetter: head[0], answer: head };
}
async function lookupWordByKey(key) { return (await req(store("words").index("by_word").get(key))) || null; }
function morphNeighbors(w, limit) {
  const key = w.wordKey || firstToken(w.word);
  const p = key.slice(0, Math.min(4, key.length));
  if (p.length < 3) return Promise.resolve([]);
  return new Promise(res => {
    const out = [];
    const rq = store("words").index("by_word").openCursor(IDBKeyRange.bound(p, p + "￿"));
    rq.onsuccess = e => {
      const c = e.target.result;
      if (!c || out.length >= limit + 5) return res(out);
      if (c.value.wordKey !== key) out.push(c.value);
      c.continue();
    };
    rq.onerror = () => res(out);
  });
}
// L3「反推核心」：给 1-2 句例句，猜这个词的核心块——这是唯一 100% 词条都出得了的题型，
// 也是别的兜底方式失败后的最后一道防线。干扰项优先级：对照邻居 > 形态邻居 > 本次会话同伴。
async function genCoreMC(w, pool) {
  const correct = coreText(w);
  if (!correct) return null;
  let cands = [];
  for (const n of shuffle(contrastNeighbors(w))) {
    if (cands.length >= 3) break;
    const nw = await lookupWordByKey(n.lhs.trim().toLowerCase());
    if (nw && nw.id !== w.id) cands.push(nw);
  }
  if (cands.length < 3) {
    for (const nw of shuffle(await morphNeighbors(w, 6))) {
      if (cands.length >= 3) break;
      if (nw.id !== w.id && !cands.some(c => c.id === nw.id)) cands.push(nw);
    }
  }
  if (cands.length < 3 && pool && pool.length) {
    for (const nw of shuffle(pool)) {
      if (cands.length >= 3) break;
      if (nw.id !== w.id && !cands.some(c => c.id === nw.id)) cands.push(nw);
    }
  }
  const uniq = Array.from(new Set(cands.map(coreText).filter(t => t && t !== correct))).slice(0, 3);
  const options = shuffle([correct, ...uniq]);
  if (options.length < 2) return null;
  const senses = shuffle(w.senses || []).slice(0, Math.min(2, (w.senses || []).length));
  return { type: "mc", word: w, tier: 3, prompt: senses.map(s => s.example), options, answerIndex: options.indexOf(correct) };
}
// 绝对兜底：数据实在不够（核心块也没有）时退回最朴素的自评——
// 例句摆出来，自己按有没有印象判断，跟老版本一样，只在数据缺口时才会走到这里。
function genSelfReport(w) {
  const list = w.senses || [];
  const s = list[Math.floor(Math.random() * Math.max(1, list.length))];
  return { type: "self", word: w, tier: 0, prompt: (s && s.example) || w.word };
}

RENDER.review = function () {

  setTitle("复习", (RS.idx + 1) + " / " + total);
  setAction("");
  let h = '<div class="progressbar" style="margin-bottom:22px"><i style="width:' + (RS.idx / total * 100) + '%"></i></div>';

  if (RS.revealed) {
    h += '<div class="sheet reveal">' + renderWordFull(q.word) + "</div>" +
         '<div class="footerbar"><button class="btn dark" onclick="reviewAdvance()">继续 ›</button></div>';
    $("#v-review").innerHTML = h; return;
  }

  h += '<div class="sheet">' + renderQuizCard(q) + "</div>";
  if (q.type === "mc") {
    h += '<div class="footerbar"><div class="hint" style="flex:1;text-align:center;padding:15px 0">点一个选项作答</div></div>';
  } else if (q.type === "type") {
    h += '<div class="footerbar"><input id="l4in" class="l4input" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' +
         esc(q.firstLetter + "…") + '"><button class="btn" onclick="reviewSubmitType()">确定</button></div>';
  } else {
    h += '<div class="footerbar">' +
         '<button class="btn ghost" onclick="reviewSelf(false)">记不清</button>' +
         '<button class="btn" onclick="reviewSelf(true)">还记得</button></div>';
  }
  $("#v-review").innerHTML = h;
  if (q.type === "type") {
    const el = $("#l4in");
    if (el) { el.focus(); el.onkeydown = e => { if (e.key === "Enter") reviewSubmitType(); }; }
  }
};
function renderQuizCard(q) {
  const label = ["自评", "L1 认支线", "L2 辨邻居", "L3 反推核心", "L4 反向产出"][q.tier];
  let h = '<div class="quizhead"><span class="tierchip">' + esc(label) + "</span></div>";
  if (q.type === "mc") {
    (Array.isArray(q.prompt) ? q.prompt : [q.prompt]).forEach(ex => { h += '<p class="ex">' + hl(ex, q.word.word) + "</p>"; });
    h += '<div class="qopts">' + q.options.map((opt, i) =>
      '<button class="qopt" data-i="' + i + '" onclick="reviewPick(' + i + ')">' + esc(opt) + "</button>").join("") + "</div>";
  } else if (q.type === "type") {
    h += '<p class="tr" style="font-size:calc(18px*var(--fs));padding-left:0;border:none;margin-bottom:4px">' + esc(q.prompt) + "</p>";
  } else {
    h += '<p class="ex">' + hl(q.prompt, q.word.word) + "</p>";
  }
  return h;
}

/* ---- 作答 ---- */
async function gradeWord(correct, w) {
  scheduleWord(w, correct);
  await putWord(w);
  S.quota.ids = S.quota.ids.filter(id => id !== w.id);
  await metaSet("quota", S.quota);
}
async function reviewPick(i) {
  if (!RS || RS.picked != null) return;
  RS.picked = i;
  const correct = i === RS.cur.answerIndex;
  document.querySelectorAll(".qopt").forEach((el, idx) => {
    el.classList.add(idx === RS.cur.answerIndex ? "right" : idx === i ? "wrong" : "dim");
  });
  await gradeWord(correct, RS.cur.word);
  setTimeout(() => { correct ? reviewAdvance() : revealCurrent(); }, 550);
}
window.reviewPick = reviewPick;
async function reviewSubmitType() {
  if (!RS) return;
  const el = $("#l4in"); if (!el) return;
  const val = (el.value || "").trim().toLowerCase();
  const correct = val === RS.cur.answer.toLowerCase();
  await gradeWord(correct, RS.cur.word);
  if (correct) { toast("✓ 正确"); reviewAdvance(); } else { revealCurrent(); }
}
window.reviewSubmitType = reviewSubmitType;
async function reviewSelf(correct) {
  if (!RS) return;
  await gradeWord(correct, RS.cur.word);
  if (correct) reviewAdvance(); else revealCurrent();
}
window.reviewSelf = reviewSelf;
function revealCurrent() { RS.revealed = true; RENDER.review(); }
// loadQuestion 在队列耗尽时会调用 finishSession()——它自己把结束画面画好、
// 把 RS 置空。这里不能无条件再调一次 RENDER.review()：那样会看见 RS 已经是
// null，判定「没有会话」而跳回首页，把刚画好的「今日复习完成」提示当场冲掉。

// 让本组还在复习轮转里的词今天就到期，塞进今日复习队列，立即开始——
// 老版本这里是「手动重温已掌握的组」，现在毕业不等于退出轮转，
// 换成「想现在就多复习这组」的手动催办。
async function reviewGroupNow(gid) {
  const g = groupById(gid);
  const words = await getWords(g.wordIds);
  const today = todayKey();
  const t = tx(["words"], "readwrite"); const ws = t.objectStore("words");
  const added = [];
  words.forEach(w => {
    if (w.reviewStage == null) return;
    if (w.nextReviewDate > today) { w.nextReviewDate = today; ws.put(w); }
    added.push(w.id);
  });
  await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
  const set = new Set(S.quota.ids);
  added.forEach(id => set.add(id));
  S.quota.ids = Array.from(set);
  await metaSet("quota", S.quota);
  await startReview();
}
window.reviewGroupNow = reviewGroupNow;

async function resetGroup(gid) {
  if (!confirm("重置组 #" + gid + "？\n\n该组的全部标记和复习进度会清空，回到「待背」状态，并退出复习队列。此操作不可撤销。")) return;
  const g = groupById(gid);
  const words = await getWords(g.wordIds);
  const wt = tx(["words"], "readwrite").objectStore("words");
  words.forEach(w => {
    w.learned = false; w.learnedAt = null;
    delete w.reviewStage; delete w.nextReviewDate;
    wt.put(w);
  });
  await new Promise(res => { wt.transaction.oncomplete = res; });
  g.state = "pending"; g.learnedCount = 0;
  g.completedAt = null; g.learnSession = null;
  // 重置的如果正是今天消耗掉额度的那一组，把额度退回来 ——
  // 否则会卡死：既不能重背这一组，也不能开新组。
  // 只退这一组，重置旧组不会凭空变出今天的额度。
  let refunded = false;
  if (S.lastNewGroupDate === todayKey() && S.lastNewGroupId === g.id) {
    S.lastNewGroupDate = ""; S.lastNewGroupId = null;
    await metaSet("lastNewGroupDate", ""); await metaSet("lastNewGroupId", null);
    refunded = true;
  }
  await req(store("groups", "readwrite").put(g));
  S.quota.ids = S.quota.ids.filter(id => !g.wordIds.includes(id));
  await metaSet("quota", S.quota);
  toast("组 #" + gid + " 已重置" + (refunded ? "，今日新组额度已退回" : ""));
  RENDER.grouplist();
}
window.resetGroup = resetGroup;

RENDER.search = function () {
  setTitle("搜索");
  setAction("");
  $("#v-search").innerHTML =
    '<input class="searchbox" id="q" placeholder="输入英文开头，或直接输入中文" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div id="results"><div class="hint">英文按开头匹配，中文在释义里任意位置匹配。最多显示 60 条。</div></div>';
  const q = $("#q");
  q.oninput = () => doSearch(q.value.trim().toLowerCase());
  setTimeout(() => q.focus(), 60);
};
let searchTimer, searchSeq = 0;
function doSearch(p) {
  clearTimeout(searchTimer);
  // 中文扫索引比英文前缀查询慢得多，慢的旧查询可能后落地盖掉新结果
  const mySeq = ++searchSeq;
  searchTimer = setTimeout(async () => {
    if (mySeq !== searchSeq) return;
    if (!p) { $("#results").innerHTML = '<div class="hint">英文按开头匹配，中文在释义里任意位置匹配。最多显示 60 条。</div>'; return; }
    let out = [];
    if (HAS_CJK.test(p)) {
      // 中文：扫轻量索引取 id，再按 id 批量取词条
      const ids = [];
      await new Promise(res => {
        const c = store("zhidx").openCursor();
        c.onsuccess = e => {
          const cur = e.target.result;
          if (!cur || ids.length >= 60) return res();
          if (cur.value.t && cur.value.t.indexOf(p) >= 0) ids.push(cur.value.id);
          cur.continue();
        };
        c.onerror = () => res();
      });
      out = await getWords(ids);
    } else {
      const idx = store("words").index("by_word");
      const range = IDBKeyRange.bound(p, p + "￿");
      await new Promise(res => {
        const c = idx.openCursor(range);
        c.onsuccess = e => {
          const cur = e.target.result;
          if (!cur || out.length >= 60) return res();
          out.push(cur.value); cur.continue();
        };
        c.onerror = () => res();
      });
    }
    if (mySeq !== searchSeq) return;                 // 已有更新的查询在跑，丢弃本次结果
    $("#results").innerHTML = out.length
      ? out.map(w => '<button class="listitem" style="width:100%;text-align:left" onclick="openWordPlain(' + w.id + ')">' +
          '<span class="dot' + (w.learned ? " on" : "") + '"></span><span class="w">' + esc(w.word) + "</span>" +
          '<span class="t">' + esc((w.senses[0] && w.senses[0].translation) || "") + "</span></button>").join("")
      : '<div class="empty">没有找到「' + esc(p) + "」</div>";
  }, 140);
}

async function checkText(text) {
  if (!text || !text.trim()) { toast("内容是空的"); return; }
  const entries = parseVocab(text);
  if (!entries.length) { toast("没有解析出任何词条"); return; }

  // 去重（静默防线）：批内去重 + 与词库比对，全部在同一个事务里发起
  const dupes = [];
  const seen = new Set();
  const uniq = [];
  for (const e of entries) {
    const key = e.word.toLowerCase();
    if (seen.has(key)) { dupes.push(e.word); continue; }
    seen.add(key);
    uniq.push(e);
  }
  const idx = store("words").index("by_word");
  const hits = await Promise.all(uniq.map(e => req(idx.getKey(e.word.toLowerCase()))));
  const fresh = [];
  uniq.forEach((e, i) => { if (hits[i] === undefined) fresh.push(e); else dupes.push(e.word); });
  const issues = entries.filter(e => e.issues.length);
  PENDING = fresh;

  // 分组按义项数贴边界，这里只是预估——真正分组要等提交后 formGroups 实际跑一遍。
  const looseWords = await getWords(S.looseIds);
  const looseSenses = looseWords.reduce((a, w) => a + senseCount(w), 0);
  const freshSenses = fresh.reduce((a, e) => a + (e.senses ? e.senses.length : 0), 0);
  const estGroups = Math.floor((looseSenses + freshSenses) / GROUP_TARGET);
  let h = '<div class="eyebrow">解析结果</div><div class="card">' +
    '<div class="title">共识别 ' + entries.length + " 个词条</div>" +
    '<div class="meta">可新增 <b style="color:var(--green-text)">' + fresh.length + "</b> 个" +
    (dupes.length ? "　·　跳过重复 " + dupes.length + " 个" : "") +
    (issues.length ? '　·　<span style="color:var(--danger)">' + issues.length + " 个有格式问题</span>" : "") +
    "</div><div class=\"meta\">导入后预计可成组：约 <b>" + estGroups + "</b> 组（每组目标 " + GROUP_TARGET + " 义项，实际以提交后为准）</div></div>";

  if (issues.length) {
    h += '<div class="eyebrow">格式问题（仍可导入，但建议先修）</div>';
    issues.slice(0, 40).forEach(e => {
      e.issues.forEach(i => { h += '<div class="issue"><b>第 ' + i.n + " 行</b>　" + esc(i.msg) + "</div>"; });
    });
    if (issues.length > 40) h += '<div class="hint">…还有 ' + (issues.length - 40) + " 个词条有问题</div>";
  }
  if (dupes.length) {
    h += '<div class="eyebrow">跳过的重复词（' + dupes.length + "）</div>" +
         '<div class="card flat hint" style="font-family:var(--serif)">' + dupes.slice(0, 120).map(esc).join("、") +
         (dupes.length > 120 ? " …" : "") + "</div>";
  }
  h += '<div class="eyebrow">预览（前 3 条）</div>';
  fresh.slice(0, 3).forEach(e => { h += '<div class="card">' + renderWordFull(e) + "</div>"; });
  h += '<button class="btn" style="margin-top:12px" onclick="commitImport()">确认导入 ' + fresh.length + " 个词</button>";
  $("#report").innerHTML = h;
  $("#report").scrollIntoView({ behavior: "smooth", block: "start" });
}
window.checkText = checkText;

async function commitImport() {
  if (!PENDING || !PENDING.length) { toast("没有可导入的词"); return; }
  const total = PENDING.length;
  await busy("正在导入", "0 / " + total + " 词", 0);
  let seq = S.nextSeq;
  const newIds = [];
  const CHUNK = 400;                       // 分块写，块之间让出主线程刷新进度
  for (let i = 0; i < total; i += CHUNK) {
    const t = tx(["words", "zhidx"], "readwrite");
    const ws = t.objectStore("words"), zs = t.objectStore("zhidx");
    for (const e of PENDING.slice(i, i + CHUNK)) {
      zs.put({ id: seq, t: zhText(e) });
      ws.put({
        id: seq, seq,
        word: e.word,                       // 展示用原文
        wordKey: e.word.toLowerCase(),      // 索引 / 去重 / 搜索键
        senses: e.senses, summary: e.summary, head: e.head, raw: e.raw,
        groupId: null, learned: false, learnedAt: null,
      });
      newIds.push(seq);
      seq++;
    }
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    await busy("正在导入", Math.min(i + CHUNK, total) + " / " + total + " 词",
               Math.min(i + CHUNK, total) / total * 70);
  }
  const firstId = newIds[0], lastId = newIds[newIds.length - 1];
  S.nextSeq = seq;
  S.looseIds = S.looseIds.concat(newIds);
  await metaSet("nextSeq", seq);
  const groupsBefore = S.groups.map(g => g.id);
  const made = await formGroups(p => busy("正在分组", p.done + " / " + p.total + " 组", 70 + p.done / p.total * 30));
  const newGroupIds = S.groups.map(g => g.id).filter(id => groupsBefore.indexOf(id) < 0);
  await metaSet("looseIds", S.looseIds);
  S.importLog.push({ at: new Date().toISOString(), n: newIds.length, firstId, lastId, groupIds: newGroupIds });
  await metaSet("importLog", S.importLog);
  PENDING = null;
  await refreshQuota();
  busy(false);
  toast("导入 " + newIds.length + " 词，新成 " + made + " 组");
  go("home", false);
}
window.commitImport = commitImport;

// 撤销最近一次导入。导入是追加的，所以撤销永远是砍掉尾巴 ——
// 组号保持连续，不会出现空洞。只允许从栈顶弹，不能撤中间某一批。
async function undoLastImport() {
  const b = S.importLog[S.importLog.length - 1];
  if (!b) { toast("没有可撤销的导入"); return; }
  const touched = (b.groupIds || []).map(groupById).filter(g => g && g.state !== "pending");
  if (touched.length) {
    alert("撤销不了这一批。\n\n它生成的组 " + touched.map(g => "#" + g.id).join("、") +
          " 已经开始背诵或进入复习了，删掉会破坏进度。\n\n" +
          "如果确实要清掉，请先在组详情里「重置本组」，再回来撤销。");
    return;
  }
  if (!confirm("撤销最近一次导入？\n\n将删除 " + b.n + " 个词" +
      ((b.groupIds || []).length ? "、" + b.groupIds.length + " 个组（#" + b.groupIds.join("、#") + "）" : "") +
      "。\n这些词的收藏也会一并移除。此操作不可恢复。")) return;

  const total = b.lastId - b.firstId + 1;
  await busy("正在撤销", "0 / " + total + " 词", 0);
  const CHUNK = 500;
  for (let from = b.firstId; from <= b.lastId; from += CHUNK) {
    const to = Math.min(from + CHUNK - 1, b.lastId);
    const t = tx(["words", "zhidx"], "readwrite");
    const ws = t.objectStore("words"), zs = t.objectStore("zhidx");
    for (let id = from; id <= to; id++) { ws.delete(id); zs.delete(id); }
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    await busy("正在撤销", (to - b.firstId + 1) + " / " + total + " 词", (to - b.firstId + 1) / total * 100);
  }
  const tg = tx(["groups"], "readwrite");
  (b.groupIds || []).forEach(id => tg.objectStore("groups").delete(id));
  await new Promise((res, rej) => { tg.oncomplete = res; tg.onerror = () => rej(tg.error); });
  busy(false);

  S.groups = S.groups.filter(g => (b.groupIds || []).indexOf(g.id) < 0);
  S.looseIds = S.looseIds.filter(id => id < b.firstId);
  S.starredOrder = S.starredOrder.filter(id => id < b.firstId);
  S.starred = new Set(S.starredOrder);
  S.nextSeq = b.firstId;
  S.importLog.pop();
  await metaSet("looseIds", S.looseIds);
  await metaSet("starredIds", S.starredOrder);
  await metaSet("nextSeq", S.nextSeq);
  await metaSet("importLog", S.importLog);
  await refreshQuota();
  toast("已撤销：删除 " + b.n + " 个词");
  go("home", false);
}
window.undoLastImport = undoLastImport;

// 把暂存区的词按 seq 顺序切成整 50 的组（不足 50 的留在暂存区）
// 按义项数（不是词数）贴边界切批——一个词的信息量能差 14 倍（back=50 义项，
// 普通词 3 个），按词数切组会让有的批次比别的批次重快两倍。
// 算法跟 scripts/resplit-b.py 切文件用的是同一个思路：不是「攒够就切」，
// 是每来一个词就比较「现在切」和「带上它再切」哪个更接近目标，选更接近的；
// 下限防止批次切得太碎——宁可超一点也别不到目标四成就收尾。
// 单个词的义项数就超过目标（未来写出义项极多的核心词时）：它自己独占一批。
function packBatches(entries, target, floorRatio) {
  const floor = target * floorRatio;
  const batches = [];
  let cur = [], curW = 0;
  for (const e of entries) {
    if (e.w >= target) {
      if (cur.length) { batches.push(cur); cur = []; curW = 0; }
      batches.push([e]);
      continue;
    }
    if (cur.length && curW >= floor) {
      const includeErr = Math.abs(target - (curW + e.w));
      const excludeErr = Math.abs(target - curW);
      if (excludeErr <= includeErr) { batches.push(cur); cur = [e]; curW = e.w; continue; }
    }
    cur.push(e); curW += e.w;
  }
  // cur 里剩的是还没被判定该收在哪一批的尾巴——留在暂存区，
  // 等下次导入的词来了再判断，不强行凑批（对应老逻辑「不满 50 留暂存区」）。
  return { batches, leftover: cur };
}

async function formGroups(onProgress) {
  let nextGid = S.groups.length ? Math.max.apply(null, S.groups.map(g => g.id)) + 1 : 1;
  if (!S.looseIds.length) return 0;
  const words = await getWords(S.looseIds);           // 一次性读，之后全在内存里判
  const byId = {}; words.forEach(w => byId[w.id] = w);
  const entries = S.looseIds.map(id => ({ id, w: senseCount(byId[id]) || 1 }));
  const { batches, leftover } = packBatches(entries, GROUP_TARGET, GROUP_FLOOR_RATIO);
  let made = 0;
  for (const b of batches) {
    const ids = b.map(e => e.id);
    const g = {
      id: nextGid++, wordIds: ids, state: "pending",
      learnedCount: 0, startedAt: null, completedAt: null, learnSession: null,
    };
    const t = tx(["words", "groups"], "readwrite");
    const ws = t.objectStore("words");
    ids.forEach(id => { const w = byId[id]; w.groupId = g.id; ws.put(w); });
    t.objectStore("groups").put(g);
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    S.groups.push(g);
    made++;
    if (onProgress) await onProgress({ done: made, total: batches.length });
  }
  S.looseIds = leftover.map(e => e.id);
  S.groups.sort((a, b) => a.id - b.id);
  return made;
}

      '恢复时先导入对应的词表 .txt，再恢复这个文件。</div>' +
    '<button class="btn ghost" style="margin-bottom:10px" onclick="exportBackup()">导出完整备份（含词库正文）</button>' +
    '<label class="btn ghost" style="margin-bottom:10px">导入备份（覆盖现有数据）' +
      '<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label>' +
    '<div class="eyebrow">关于</div>' +
    '<div class="card flat hint">版本 <b>' + APP_VERSION + "</b>　·　离线缓存：<b>" +
    (navigator.serviceWorker && navigator.serviceWorker.controller ? "已就绪" : "未启用") + "</b>" +
    (location.protocol === "https:" || location.hostname === "localhost" ? "" :
      '<br><span style="color:var(--danger)">当前不是 HTTPS，离线缓存无法启用</span>') +
    "</div>" +
    '<div class="eyebrow">危险操作</div>' +
    '<button class="btn danger" onclick="wipeAll()">清空全部数据</button>';
};
function setSetting(k, v) { S.settings[k] = v; saveSettings(); if (S.view === "settings") RENDER.settings(); }
window.setSetting = setSetting;

async function exportBackup() {
  await busy("正在生成完整备份", "读取词库…", 20);
  const groups = await req(store("groups").getAll());
  const meta = await req(store("meta").getAll());
  // 词库用游标分块序列化，避免一次性把 10 万条记录全部装进内存
  const parts = ['{"v":1,"exportedAt":"' + new Date().toISOString() + '"' +
                 ',"settings":' + JSON.stringify(S.settings) +
                 ',"groups":' + JSON.stringify(groups) +
                 ',"meta":' + JSON.stringify(meta) +
                 ',"words":['];
  let buf = [], firstChunk = true;
  await new Promise((res, rej) => {
    const c = store("words").openCursor();
    c.onsuccess = e => {
      const cur = e.target.result;
      if (!cur) {
        if (buf.length) { parts.push((firstChunk ? "" : ",") + buf.join(",")); }
        return res();
      }
      buf.push(JSON.stringify(cur.value));
      if (buf.length >= 500) {
        parts.push((firstChunk ? "" : ",") + buf.join(","));
        firstChunk = false; buf = [];
      }
      cur.continue();
    };
    c.onerror = () => rej(c.error);
  });
  parts.push("]}");
  const blob = new Blob(parts, { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词备份-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.lastBackup = todayKey();
  await metaSet("lastBackup", S.lastBackup);
  busy(false);
  toast("备份已导出（" + fmtSize(blob.size) + "）");
}
window.exportBackup = exportBackup;

// 仅进度备份：不含词库正文，用 wordKey 作锚点，重新导入 txt 后仍能还原
async function exportProgress() {
  toast("正在生成进度备份…");
  const groups = await req(store("groups").getAll());
  const meta = await req(store("meta").getAll());
  const id2key = {}, prog = [];
  await new Promise((res, rej) => {
    const c = store("words").openCursor();
    c.onsuccess = e => {
      const cur = e.target.result;
      if (!cur) return res();
      const w = cur.value;
      id2key[w.id] = w.wordKey;
      // 复习进度下沉到词，备份也要跟着存到词：stage/到期日缺省是 null，
      // 表示这个词还没进复习（背诵中或待背）。
      if (w.learned || w.forgotCount || w.reviewStage != null)
        prog.push([w.wordKey, w.learned ? 1 : 0, w.forgotCount || 0,
                   w.reviewStage != null ? w.reviewStage : null, w.nextReviewDate || null]);
      cur.continue();
    };
    c.onerror = () => rej(c.error);
  });
  const metaObj = {}; meta.forEach(m => metaObj[m.k] = m.v);
  const payload = {
    v: 1, kind: "progress", exportedAt: new Date().toISOString(), settings: S.settings,
    groups: groups.map(g => Object.assign({}, g, {
      wordIds: undefined, wordKeys: g.wordIds.map(i => id2key[i]).filter(Boolean),
    })),
    looseKeys: (metaObj.looseIds || []).map(i => id2key[i]).filter(Boolean),
    starredKeys: (metaObj.starredIds || []).map(i => id2key[i]).filter(Boolean),
    meta: { quota: metaObj.quota, lastNewGroupDate: metaObj.lastNewGroupDate,
            lastNewGroupId: metaObj.lastNewGroupId, lastBackup: metaObj.lastBackup,
            importLog: metaObj.importLog },
    progress: prog,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词进度-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.lastBackup = todayKey(); await metaSet("lastBackup", S.lastBackup);
  toast("进度备份已导出（" + fmtSize(blob.size) + "）");
}
window.exportProgress = exportProgress;

async function restoreProgress(p) {
  if (S.nextSeq <= 1) throw new Error("词库是空的，请先导入词表 .txt");
  // 现有词库的 wordKey -> id
  const key2id = {};
  await new Promise((res, rej) => {
    const c = store("words").openCursor();
    c.onsuccess = e => { const cur = e.target.result; if (!cur) return res();
      key2id[cur.value.wordKey] = cur.value.id; cur.continue(); };
    c.onerror = () => rej(c.error);
  });
  const missing = [];
  const mapK = k => { const id = key2id[k]; if (id === undefined) missing.push(k); return id; };

  const groups = p.groups.map(g => {
    const o = Object.assign({}, g);
    o.wordIds = (g.wordKeys || []).map(mapK).filter(x => x !== undefined);
    delete o.wordKeys;
    return o;
  });
  const looseIds   = (p.looseKeys   || []).map(mapK).filter(x => x !== undefined);
  const starredIds = (p.starredKeys || []).map(mapK).filter(x => x !== undefined);

  // 先把每个词要打的补丁算好，再用游标单遍写入 ——
  // 分成两轮 get/put 会在同一事务里撞车：后一轮的 get 早于前一轮的 put 落地，
  // 结果把 learned 覆盖回 false。
  const patch = {};
  groups.forEach(g => g.wordIds.forEach(id => { (patch[id] = patch[id] || {}).groupId = g.id; }));
  (p.progress || []).forEach(([k, l, f, stage, due]) => {
    const id = key2id[k]; if (id === undefined) return;
    const o = patch[id] = patch[id] || {};
    o.learned = !!l; o.forgotCount = f || 0;
    if (stage != null) { o.reviewStage = stage; o.nextReviewDate = due; }
  });

  const t = tx(["words", "groups", "meta"], "readwrite");
  const ws = t.objectStore("words"), gs = t.objectStore("groups"), ms = t.objectStore("meta");
  gs.clear();
  groups.forEach(g => gs.put(g));
  const cur = ws.openCursor();
  cur.onsuccess = e => {
    const c = e.target.result; if (!c) return;
    const w = c.value, o = patch[w.id];
    w.groupId     = o && o.groupId !== undefined ? o.groupId : null;
    w.learned     = !!(o && o.learned);
    w.learnedAt   = w.learned ? (w.learnedAt || todayKey()) : null;
    w.forgotCount = (o && o.forgotCount) || 0;
    // reviewStage/nextReviewDate 要么都设置要么都不设置——不设置时必须整个
    // delete 掉字段，不能留 undefined：by_due 索引靠「字段不存在」排除待背/背诵中的词。
    if (o && o.reviewStage != null) { w.reviewStage = o.reviewStage; w.nextReviewDate = o.nextReviewDate; }
    else { delete w.reviewStage; delete w.nextReviewDate; }
    c.update(w);
    c.continue();
  };
  Object.keys(p.meta || {}).forEach(k => { if (p.meta[k] !== undefined) ms.put({ k, v: p.meta[k] }); });
  ms.put({ k: "looseIds", v: looseIds });
  ms.put({ k: "starredIds", v: starredIds });
  await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });

  if (p.settings) { S.settings = p.settings; saveSettings(); }
  await loadState();
  return { groups: groups.length, missing: [...new Set(missing)] };
}

function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let p;
    try { p = JSON.parse(r.result); } catch (err) { toast("不是合法的备份文件"); return; }
    if (p.kind === "progress") {
      if (S.nextSeq <= 1) { alert("这是【仅进度】备份，不含词库正文。\n请先把对应的词表 .txt 导入，再恢复进度。"); return; }
      if (!confirm("恢复【仅进度】备份：\n覆盖当前的分组、标记、收藏和复习进度，词库正文不动。\n\n确定继续？")) return;
      try {
        const r = await restoreProgress(p);
        toast("进度已恢复（" + r.groups + " 组）");
        if (r.missing.length) alert("有 " + r.missing.length + " 个词在当前词库里找不到，已跳过：\n" +
          r.missing.slice(0, 20).join("、") + (r.missing.length > 20 ? " …" : "") +
          "\n\n通常是词表 .txt 没有全部导入。");
      } catch (err) { toast("恢复失败：" + (err && err.message || err)); return; }
      go("home", false);
      return;
    }
    if (!p.words || !p.groups) { toast("备份文件格式不对"); return; }
    if (!confirm("导入备份会【覆盖】当前全部数据（" + (S.nextSeq - 1) + " 词）。\n备份含 " + p.words.length + " 词、" + p.groups.length + " 组。\n\n确定继续？")) return;
    const t = tx(["words", "groups", "meta"], "readwrite");
    t.objectStore("words").clear(); t.objectStore("groups").clear(); t.objectStore("meta").clear();
    p.words.forEach(w => t.objectStore("words").put(w));
    p.groups.forEach(g => t.objectStore("groups").put(g));
    (p.meta || []).forEach(m => t.objectStore("meta").put(m));
    await new Promise(res => { t.oncomplete = res; });
    if (p.settings) { S.settings = p.settings; saveSettings(); }
    await loadState();
    toast("备份已恢复");
    go("home", false);
  };
  r.readAsText(f, "utf-8");
}
window.importBackup = importBackup;

async function wipeAll() {
  if (!confirm("清空全部数据？\n\n词库、进度、复习记录都会被删除，无法撤销。建议先导出备份。")) return;
  if (!confirm("再确认一次：真的要清空吗？")) return;
  const t = tx(["words", "groups", "meta"], "readwrite");
  t.objectStore("words").clear(); t.objectStore("groups").clear(); t.objectStore("meta").clear();
  await new Promise(res => { t.oncomplete = res; });
  await loadState();
  toast("已清空");
  go("home", false);
}
window.wipeAll = wipeAll;

/* ============================== 启动 ============================== */
window.go = go;
window.RENDER = RENDER;
window.$ = $;
window.GTAB = GTAB;

// 触摸滑动切换背诵卡片
let tx0 = 0, ty0 = 0;
document.addEventListener("touchstart", e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (S.view !== "learn" || !LS) return;
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) learnStep(dx < 0 ? 1 : -1);
}, { passive: true });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applySettings);

if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            toast("已下载新版本，下次打开生效");
          }
        });
      });
    }).catch(() => {});
  });
}

(async function boot() {
  loadSettings();
  try {
    await openDB();
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
    await loadState();
    go("home", false);
  } catch (e) {
    document.querySelector("main").innerHTML =
      '<div class="empty">数据库打开失败<br><br>' + esc(e && e.message || e) + "</div>";
  }
})();
</script>
