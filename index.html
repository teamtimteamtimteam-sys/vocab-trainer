<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="theme-color" content="#ffffff">
<title>背单词</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* =========================================================================
   背单词 · 设计系统
   基底：近白纸面，黑与绿从四角渗入，巨型螺旋球线稿（品牌标记）作为纹理
   表层：两级毛玻璃 —— chrome 更通透，内容面板更实，保证长文可读
   字体：英文衬线 / 中文苹方 / 数据等宽，对应本 app 的三类信息
   规则：主题差异一律走 token，禁止 html[data-theme] 覆盖具体组件（会打乱优先级）
   ========================================================================= */
:root{
  /* —— 品牌 —— */
  --ink:#111111;
  --green:#1B8A3D;        /* 品牌绿：色块、填充、进度环一律用它 */
  --green-text:#177C34;   /* 小号绿字专用，仅比品牌绿深一档以过 4.5 */
  --paper:#FBFBFA;
  --on-green:#ffffff;

  /* —— 文字层级 —— */
  --fg:var(--ink);
  --fg-muted:rgba(17,17,17,.68);   /* 正文次级：翻译、讲解、meta   ≈5.9 */
  --fg-subtle:rgba(17,17,17,.62);  /* 小标签：eyebrow、n-label 等  ≈4.8 */
  --fg-faint:rgba(17,17,17,.34);   /* 纯装饰：chevron、等号、轨道           */

  /* —— 描边 —— */
  --line:rgba(17,17,17,.09);
  --line-strong:rgba(17,17,17,.16);
  --ring:rgba(27,138,61,.50);

  /* —— 玻璃 —— */
  --glass:rgba(255,255,255,.86);        /* 内容面板：读正文的地方 */
  --glass-chrome:rgba(251,251,250,.72); /* 顶栏底栏：内容从下面滑过 */
  --glass-sunk:rgba(17,17,17,.045);     /* 内嵌凹槽：讲解块、分段控件轨道 */
  --glass-edge:rgba(255,255,255,.75);   /* 玻璃上沿的高光发丝线 */
  --blur:24px;
  --blur-chrome:30px;

  /* —— 绿色语义 —— */
  --green-wash:rgba(27,138,61,.08);
  --green-line:rgba(27,138,61,.28);

  --danger:#B3261E;
  --danger-wash:rgba(179,38,30,.08);

  /* —— 形状与投影 —— */
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --shadow-1:0 1px 2px rgba(17,17,17,.05);
  --shadow-2:0 6px 20px -8px rgba(17,17,17,.16), 0 1px 3px rgba(17,17,17,.05);

  /* —— 字体 —— */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono",monospace;
  --fs:1;

  --bloom-green:rgba(27,138,61,.34);
  --bloom-ink:rgba(17,17,17,.26);
  --core:rgba(255,255,255,.94);
  color-scheme:light;
}
html[data-theme="dark"]{
  --ink:#F2F3F2;
  --green:#40B968;
  --green-text:#40B968;   /* 深色底上品牌绿已达 7.6，无需另设 */
  --paper:#0D0E0F;
  --on-green:#0D0E0F;

  --fg-muted:rgba(242,243,242,.72);
  --fg-subtle:rgba(242,243,242,.66);
  --fg-faint:rgba(242,243,242,.30);

  --line:rgba(242,243,242,.11);
  --line-strong:rgba(242,243,242,.18);
  --ring:rgba(64,185,104,.55);

  --glass:rgba(28,30,31,.84);
  --glass-chrome:rgba(18,19,20,.72);
  --glass-sunk:rgba(242,243,242,.055);
  --glass-edge:rgba(242,243,242,.08);

  --green-wash:rgba(64,185,104,.13);
  --green-line:rgba(64,185,104,.34);

  --danger:#FF6B61;
  --danger-wash:rgba(255,107,97,.10);

  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 8px 24px -10px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.35);

  --bloom-green:rgba(64,185,104,.30);
  --bloom-ink:rgba(255,255,255,.10);
  --core:rgba(13,14,15,.92);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);min-height:100%}
body{
  margin:0;min-height:100%;
  color:var(--fg);
  font-family:var(--sans);
  font-size:calc(17px * var(--fs));
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  background:transparent;
}

/* ——— 基底：四角渗入的黑与绿 ——— */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    /* 最上层：把中心洗回近白，保证正文区不带色 */
    radial-gradient(62% 46% at 50% 44%, var(--core), transparent 74%),
    /* 下面四层：色只留在四角 */
    radial-gradient(40% 30% at 100% 0%,   var(--bloom-green), transparent 72%),
    radial-gradient(36% 27% at 0% 100%,   var(--bloom-green), transparent 72%),
    radial-gradient(42% 32% at 0% 0%,     var(--bloom-ink),   transparent 72%),
    radial-gradient(46% 35% at 100% 100%, var(--bloom-ink),   transparent 74%);
}

#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:where(button,a,input,textarea,label.btn,.gcell,.listitem,.rowbtn):focus-visible{
  outline:2px solid var(--ring);outline-offset:2px;
}

/* ============================ chrome ============================ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--glass-chrome);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  padding:max(env(safe-area-inset-top),8px) 16px 10px;
  display:flex;align-items:center;gap:12px;min-height:52px;
}
.topbar h1{
  font-size:calc(17px*var(--fs));font-weight:640;margin:0;flex:1;
  letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px;
}
.topbar .sub{
  font-family:var(--mono);font-size:calc(11.5px*var(--fs));font-weight:500;
  color:var(--fg-subtle);letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.iconbtn{
  min-width:44px;min-height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-sm);font-size:calc(14.5px*var(--fs));font-weight:500;
  color:var(--fg-muted);margin:0 -8px;padding:0 8px;
  transition:background .15s,color .15s;
}
.iconbtn:active{background:var(--glass-sunk);color:var(--fg)}
.iconbtn.accent{color:var(--green-text);font-weight:600}

main{
  flex:1;padding:22px 16px calc(40px + env(safe-area-inset-bottom));
  max-width:840px;width:100%;margin:0 auto;
}
.view{display:none}
.view.on{display:block}

/* ============================ 面板 ============================ */
.card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:16px 18px;margin-bottom:14px;
}
.card.flat{background:var(--glass-sunk);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

.rowbtn{
  width:100%;text-align:left;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:15px 18px;margin-bottom:11px;
  display:flex;align-items:center;gap:14px;
  transition:transform .13s cubic-bezier(.2,.8,.3,1), box-shadow .13s, border-color .13s;
}
.rowbtn:active{transform:scale(.988);box-shadow:none;border-color:var(--line-strong)}
.rowbtn[disabled]{opacity:.5}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .chev{color:var(--fg-faint);font-size:calc(19px*var(--fs));line-height:1}
.rowbtn.locked{
  background:none;border-style:dashed;border-color:var(--line-strong);
  box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
}

.eyebrow{
  font-size:calc(11px*var(--fs));letter-spacing:.14em;
  color:var(--fg-subtle);font-weight:600;margin:28px 2px 11px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:0}

.title{font-size:calc(16.5px*var(--fs));font-weight:640;letter-spacing:-.005em}
.meta{font-size:calc(13px*var(--fs));color:var(--fg-muted);margin-top:3px;font-variant-numeric:tabular-nums}
.big{font-size:calc(15px*var(--fs));font-weight:600;color:var(--green-text)}

/* ============================ 按钮 ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 22px;border-radius:var(--r-md);
  font-weight:620;font-size:calc(15.5px*var(--fs));letter-spacing:-.005em;
  width:100%;border:1px solid transparent;
  background:var(--green);color:var(--on-green);
  box-shadow:var(--shadow-1);
  transition:transform .12s cubic-bezier(.2,.8,.3,1), opacity .12s, background .15s;
}
.btn:active{transform:translateY(1px);opacity:.9}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{
  background:var(--glass);color:var(--fg);border-color:var(--line-strong);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
}
.btn.ghost:active{background:var(--glass-sunk)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.danger{background:var(--danger-wash);color:var(--danger);border-color:transparent}
.btn.danger:active{background:var(--danger-wash);opacity:.75}

.footerbar{
  position:sticky;bottom:0;margin-top:26px;
  background:var(--glass-chrome);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  border-top:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:11px;
}
.footerbar .btn{flex:1}
.markbtn{background:var(--glass);color:var(--fg);border-color:var(--line-strong)}
.markbtn.done{background:var(--green);color:var(--on-green);border-color:transparent}

/* ============================ 进度 ============================ */
.progressbar{height:3px;background:var(--glass-sunk);border-radius:2px;overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .3s cubic-bezier(.2,.8,.3,1)}
.navrow{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:4px}
.navrow button{
  color:var(--fg-subtle);font-size:calc(14px*var(--fs));padding:8px 4px;min-width:44px;
  border-radius:var(--r-sm);
}
.navrow button:active{color:var(--fg)}
.navrow button[disabled]{opacity:.3;pointer-events:none}
.navrow span{font-family:var(--mono);font-size:calc(11.5px*var(--fs));color:var(--fg-subtle);font-variant-numeric:tabular-nums}

/* 签名元素：螺旋进度环 —— 品牌标记本身用来表达「一组走完了多少」 */
.ring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line-strong)}
.ring .arc{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.3,1)}
.ringwrap{position:relative;display:grid;place-items:center;flex:none}
.ringwrap b{
  position:absolute;font-family:var(--mono);font-size:calc(11px*var(--fs));
  font-weight:600;color:var(--fg-muted);font-variant-numeric:tabular-nums;
}

/* ============================ 词条 ============================ */
/* 阅读面板：长文必须有干净的底，不能直接压在底纹上 */
.sheet{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2), inset 0 1px 0 var(--glass-edge);
  padding:22px 22px 24px;
}
@media (max-width:520px){ .sheet{padding:18px 16px 20px;border-radius:var(--r-md)} }
.wordhead{display:flex;align-items:flex-start;gap:12px;margin:4px 0 24px}
.wordhead .w{
  font-family:var(--serif);font-weight:700;
  font-size:calc(45px*var(--fs));line-height:1.12;letter-spacing:-.022em;
  word-break:break-word;flex:1;
}
.spk{
  min-width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  color:var(--green);margin-top:10px;flex:none;transition:background .15s;
}
.spk svg{width:20px;height:20px}
.spk:active{background:var(--green-wash)}
.spk.sm{
  display:inline-flex;width:25px;min-width:25px;height:21px;border-radius:6px;
  vertical-align:-3px;margin:0 0 0 3px;color:var(--fg-faint);
}
.spk.sm svg{width:14px;height:14px}
.spk.sm:active{color:var(--green);background:var(--green-wash)}
/* 星标：用墨黑不用绿 —— 绿是「已掌握」，收藏夹装的恰恰是没掌握的词 */
.star{
  min-width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  color:var(--fg-faint);margin-top:10px;flex:none;transition:color .15s,background .15s,transform .15s;
}
.star svg{width:21px;height:21px}
.star:active{background:var(--glass-sunk);transform:scale(.9)}
.star.on{color:var(--ink)}
.listitem .star{min-width:32px;height:32px;margin:0;align-self:center}
.listitem .star svg{width:17px;height:17px}
.favmeta{
  font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--fg-subtle);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;
}

.sense{margin:0 0 26px}
.sense:last-child{margin-bottom:8px}
.snum{
  font-family:var(--serif);font-size:calc(18px*var(--fs));color:var(--green-text);
  font-weight:700;margin-right:3px;
}
.ex{
  font-family:var(--serif);font-size:calc(21px*var(--fs));line-height:1.58;
  color:var(--fg);margin:0 0 9px;letter-spacing:-.003em;
}
.ex .hl{color:var(--green);font-weight:700}
.tr{
  font-size:calc(15.5px*var(--fs));color:var(--fg-muted);line-height:1.66;
  margin:0 0 12px;padding-left:15px;border-left:2px solid var(--line);
}

.notes{background:var(--glass-sunk);border-radius:var(--r-md);padding:13px 15px;margin-top:11px}
.notes > *{margin:0}
.notes > * + *{margin-top:8px}
.n-label{font-size:calc(12.5px*var(--fs));color:var(--fg-subtle);font-weight:600}
.n-text{font-size:calc(14.5px*var(--fs));color:var(--fg-muted);line-height:1.64}
.n-en{font-family:var(--serif);font-size:calc(15.5px*var(--fs));color:var(--fg-muted);line-height:1.55}
.n-gloss{
  font-size:calc(13.5px*var(--fs));color:var(--fg-muted);
  padding-left:13px;border-left:2px solid var(--line);
}
.eq{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-radius:var(--r-sm);
  background:var(--green-wash);
  box-shadow:inset 3px 0 0 var(--green);
}
.eq .lhs{font-family:var(--serif);font-weight:700;color:var(--green-text);font-size:calc(15.5px*var(--fs))}
.eq .eqs{color:var(--fg-faint);font-size:calc(13px*var(--fs))}
.eq .rhs{color:var(--fg);font-size:calc(14.5px*var(--fs))}

.summary{margin-top:24px;padding-top:19px;border-top:1px solid var(--line)}

/* ============================ 统计 / 提示 ============================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  padding:13px 10px;text-align:center;
}
.stat b{
  display:block;font-family:var(--mono);font-size:calc(23px*var(--fs));
  font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.stat span{font-size:calc(11.5px*var(--fs));color:var(--fg-muted)}
.stat.g b{color:var(--green-text)}

.banner{
  border:1px solid var(--green-line);background:var(--green-wash);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border-radius:var(--r-md);padding:12px 15px;margin-bottom:14px;
  font-size:calc(13.5px*var(--fs));display:flex;gap:12px;align-items:center;
}
.banner .grow{flex:1}
.banner button{color:var(--green-text);font-weight:620;white-space:nowrap;padding:6px 2px}
.hint{font-size:calc(13px*var(--fs));color:var(--fg-muted);line-height:1.6}
.hint.warn{color:var(--danger)}
.empty{text-align:center;color:var(--fg-subtle);padding:56px 20px;font-size:calc(15px*var(--fs))}

/* ============================ 组列表 ============================ */
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:8px 14px;border-radius:var(--r-sm);font-size:calc(13.5px*var(--fs));
  background:var(--glass-sunk);color:var(--fg-muted);white-space:nowrap;
  border:1px solid transparent;transition:background .15s,color .15s;
}
.tabs button.on{background:var(--ink);color:var(--paper);font-weight:620}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
/* 数量可达数千，这里不用 backdrop-filter，改用实色 tint —— 否则 iPad 上会卡 */
.gcell{
  aspect-ratio:1;border-radius:var(--r-md);
  background:var(--glass-sunk);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s;
}
.gcell:active{transform:scale(.94)}
.gcell b{
  font-family:var(--mono);font-size:calc(16px*var(--fs));font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.gcell span{font-family:var(--mono);font-size:calc(9.5px*var(--fs));color:var(--fg-subtle);letter-spacing:.04em}
.gcell.learning{border-color:var(--ink)}
.gcell.reviewing{background:var(--green-wash);border-color:var(--green-line)}
.gcell.reviewing b,.gcell.reviewing span{color:var(--green-text)}
.gcell.mastered{background:var(--green);border-color:transparent}
.gcell.mastered b,.gcell.mastered span{color:var(--on-green)}
.gcell.due{border-color:var(--green);border-width:2px}

.listitem{
  display:flex;align-items:baseline;gap:12px;padding:13px 4px;
  border-bottom:1px solid var(--line);border-radius:var(--r-sm);
  transition:background .13s;
}
.listitem:active{background:var(--glass-sunk)}
.listitem .w{font-family:var(--serif);font-size:calc(17.5px*var(--fs));font-weight:600;min-width:0;flex:1}
.listitem .t{
  font-size:calc(13.5px*var(--fs));color:var(--fg-muted);flex:1.2;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.listitem .dot{width:7px;height:7px;border-radius:4px;background:var(--line-strong);flex:none}
.listitem .dot.on{background:var(--green)}

/* ============================ 表单 ============================ */
.searchbox{
  width:100%;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 16px;font-size:calc(16px*var(--fs));margin-bottom:16px;
  box-shadow:var(--shadow-1);
}
.searchbox:focus{outline:none;border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-wash)}
textarea.ta{
  width:100%;min-height:190px;background:var(--glass-sunk);
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  font-family:var(--mono);font-size:calc(12.5px*var(--fs));line-height:1.65;resize:vertical;
}
textarea.ta:focus{outline:none;border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-wash)}
.filepick{
  display:block;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);
  padding:26px 18px;text-align:center;color:var(--fg-muted);margin-bottom:14px;
  font-size:calc(14.5px*var(--fs));transition:border-color .15s,background .15s;
}
.filepick:active{border-color:var(--green-line);background:var(--green-wash)}
.filepick b{color:var(--green-text);display:block;margin-bottom:4px;font-size:calc(16px*var(--fs))}
.issue{
  border-left:3px solid var(--danger);padding:7px 0 7px 12px;margin:8px 0;
  font-size:calc(12.5px*var(--fs));color:var(--fg-muted);
}
.issue b{color:var(--danger);font-family:var(--mono);font-size:calc(11.5px*var(--fs))}
.setrow{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.setrow .grow{flex:1}

/* 分段控件：凹槽轨道 + 浮起的当前项 */
.seg{display:flex;background:var(--glass-sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{
  padding:7px 13px;border-radius:8px;font-size:calc(13.5px*var(--fs));
  color:var(--fg-muted);transition:color .15s;
}
.seg button.on{
  background:var(--glass);color:var(--fg);font-weight:620;
  box-shadow:var(--shadow-1), inset 0 1px 0 var(--glass-edge);
  border:1px solid var(--line);
}

.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--glass-chrome);color:var(--fg);
  -webkit-backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  backdrop-filter:blur(var(--blur-chrome)) saturate(180%);
  border:1px solid var(--line-strong);box-shadow:var(--shadow-2);
  padding:12px 20px;border-radius:var(--r-md);
  font-size:calc(13.5px*var(--fs));z-index:200;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

.reveal{animation:fade .24s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

@media (min-width:700px){
  main{padding:30px 28px calc(48px + env(safe-area-inset-bottom))}
  .ex{font-size:calc(22.5px*var(--fs))}
  .wordhead .w{font-size:calc(54px*var(--fs))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="iconbtn" id="backBtn" style="display:none">‹ 返回</button>
    <h1 id="ttl">背单词</h1>
    <button class="iconbtn" id="actBtn" style="display:none"></button>
  </div>
  <main>
    <div class="view on" id="v-home"></div>
    <div class="view" id="v-learn"></div>
    <div class="view" id="v-review"></div>
    <div class="view" id="v-groups"></div>
    <div class="view" id="v-grouplist"></div>
    <div class="view" id="v-search"></div>
    <div class="view" id="v-fav"></div>
    <div class="view" id="v-import"></div>
    <div class="view" id="v-word"></div>
    <div class="view" id="v-settings"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   背单词 · 单文件 PWA
   数据：IndexedDB(vocab_v1)  设置：localStorage
   ========================================================================= */

const GROUP_SIZE = 50;
const INTERVALS  = [1, 2, 4, 7, 15, 30];   // 天，从整组背完当天起算
const DAILY_CAP  = 5;                       // 每日复习配额（组）
const DAY_START  = 4;                       // 凌晨 4:00 为一天分界
const BACKUP_WARN_DAYS = 7;
const APP_VERSION = "1.2.0";

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function todayKey(d) {
  const t = d ? new Date(d) : new Date();
  t.setHours(t.getHours() - DAY_START);
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function addDays(key, n) {
  const [y,m,d] = key.split("-").map(Number);
  const t = new Date(y, m-1, d + n);
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function daysBetween(a, b) {
  const p = k => { const [y,m,d] = k.split("-").map(Number); return Date.UTC(y, m-1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; }
  return r;
}
function fmtSize(b) {
  return b > 1048576 ? (b / 1048576).toFixed(1) + " MB"
       : b > 1024    ? Math.round(b / 1024) + " KB" : b + " B";
}
let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ------------------------------------------------------------------- db */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("vocab_v1", 1);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      const w = d.createObjectStore("words", { keyPath: "id" });
      w.createIndex("by_word", "wordKey", { unique: true });
      w.createIndex("by_group", "groupId");
      d.createObjectStore("groups", { keyPath: "id" });
      d.createObjectStore("meta", { keyPath: "k" });
    };
    rq.onsuccess = e => { db = e.target.result; res(db); };
    rq.onerror = e => rej(e.target.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function tx(stores, mode) { return db.transaction(stores, mode); }
function store(name, mode = "readonly") { return tx([name], mode).objectStore(name); }

async function metaGet(k, dflt) {
  const r = await req(store("meta").get(k));
  return r === undefined ? dflt : r.v;
}
async function metaSet(k, v) {
  await req(store("meta", "readwrite").put({ k, v }));
}
async function getWords(ids) {
  const s = store("words");
  const out = await Promise.all(ids.map(id => req(s.get(id))));
  return out.filter(Boolean);
}
async function getWord(id) { return req(store("words").get(id)); }
async function putWord(w) { return req(store("words", "readwrite").put(w)); }

/* --------------------------------------------------------------- state */
const S = {
  groups: [],          // 全量组（数量级 2000，常驻内存）
  nextSeq: 1,          // 下一个词的 id / 全局序号
  looseIds: [],        // 暂存区（未成组）的词 id，按 seq 递增
  quota: null,         // {date, ids:[]}
  lastNewGroupDate: "",
  lastNewGroupId: null,   // 今天的新组额度被哪一组消耗了
  starredOrder: [],       // 收藏的词 id，数组顺序 = 收藏先后
  starred: new Set(),     // 同一份数据的查询视图
  lastBackup: "",
  settings: { theme: "auto", fs: 1 },
  view: "home",
  stack: [],
};

function loadSettings() {
  try { Object.assign(S.settings, JSON.parse(localStorage.getItem("vocab_settings") || "{}")); } catch (e) {}
  applySettings();
}
function saveSettings() {
  try { localStorage.setItem("vocab_settings", JSON.stringify(S.settings)); } catch (e) {}
  applySettings();
}
function applySettings() {
  const t = S.settings.theme;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name=theme-color]').setAttribute("content", dark ? "#0e0f10" : "#ffffff");
  document.documentElement.style.setProperty("--fs", S.settings.fs);
}

async function loadState() {
  S.groups = await req(store("groups").getAll());
  S.groups.sort((a, b) => a.id - b.id);
  S.nextSeq = await metaGet("nextSeq", 1);
  S.looseIds = await metaGet("looseIds", []);
  S.lastNewGroupDate = await metaGet("lastNewGroupDate", "");
  S.lastNewGroupId = await metaGet("lastNewGroupId", null);
  S.starredOrder = await metaGet("starredIds", []);
  S.starred = new Set(S.starredOrder);
  S.lastBackup = await metaGet("lastBackup", "");
  await refreshQuota();
}
const groupById = id => S.groups.find(g => g.id === id);

/* ---------------------------------------------------- 复习调度 / 门禁 */
function dueGroups(today) {
  return S.groups
    .filter(g => g.state === "reviewing" && g.nextReviewDate <= today)
    .sort((a, b) => a.nextReviewDate < b.nextReviewDate ? -1
                  : a.nextReviewDate > b.nextReviewDate ? 1 : a.id - b.id);
}
async function refreshQuota() {
  const today = todayKey();
  let q = await metaGet("quota", null);
  if (!q || q.date !== today) {
    q = { date: today, ids: dueGroups(today).slice(0, DAILY_CAP).map(g => g.id) };
    await metaSet("quota", q);
  }
  S.quota = q;
}
// 配额内尚未清掉的组
function quotaOpenGroups() {
  const today = todayKey();
  return S.quota.ids.map(groupById).filter(g => g && g.state === "reviewing" && g.nextReviewDate <= today);
}
// 配额外的额外到期组（可选做）
function extraDueGroups() {
  const today = todayKey();
  return dueGroups(today).filter(g => !S.quota.ids.includes(g.id));
}
const gateOpen = () => quotaOpenGroups().length === 0;

const learningGroup = () => S.groups.find(g => g.state === "learning");
function canStartNewGroup() {
  if (!gateOpen()) return { ok: false, why: "gate" };
  if (learningGroup()) return { ok: false, why: "inprogress" };
  if (S.lastNewGroupDate === todayKey()) return { ok: false, why: "daily" };
  if (!S.groups.some(g => g.state === "pending")) return { ok: false, why: "empty" };
  return { ok: true };
}

/* ------------------------------------------------------------ 解析器 */
const NUMS = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮";
const SUMMARY_RE = /^(所以|总之|总结|归纳|综上|因此|一个词|记住|词族|注意区别|对比|反义词|近义词)/;  // 只在最后一个例句之后、且其后不再出现新例句时才生效
const EQ_RE = /^([A-Za-z][A-Za-z0-9’'\-\s.]{0,44}?)\s*=\s*(.+)$/;

function classifyNote(line) {
  if (line.startsWith("=")) return { t: "gloss", text: line.slice(1).trim() };
  const m = line.match(EQ_RE);
  if (m && /[A-Za-z]/.test(m[1])) return { t: "eq", lhs: m[1].trim(), rhs: m[2].trim() };
  if (/[：:]$/.test(line) && line.length <= 24) return { t: "label", text: line };
  if (!/[一-鿿]/.test(line)) return { t: "en", text: line };
  return { t: "text", text: line };
}

function parseVocab(text) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  let cur = null;
  lines.forEach((raw, i) => {
    const t = raw.trim();
    if (!t) { if (cur) { blocks.push(cur); cur = null; } return; }
    if (!cur) cur = { start: i + 1, lines: [] };
    cur.lines.push({ n: i + 1, t });
  });
  if (cur) blocks.push(cur);

  return blocks.map(b => {
    const e = { word: "", senses: [], summary: [], head: [], issues: [], line: b.start,
                raw: b.lines.map(l => l.t).join("\n") };
    const first = b.lines[0].t;
    e.word = first;
    if (!/^[A-Za-z][A-Za-z0-9’'\-. ]*$/.test(first) || first.split(/\s+/).length > 4) {
      e.issues.push({ n: b.lines[0].n, msg: "首行不像单词：「" + first + "」" });
    }
    let sense = null, inSummary = false;
    for (let i = 1; i < b.lines.length; i++) {
      const { n, t } = b.lines[i];
      const idx = NUMS.indexOf(t[0]);
      if (idx >= 0) {
        sense = { no: idx + 1, example: t.slice(1).trim(), translation: "", notes: [] };
        e.senses.push(sense); inSummary = false; continue;
      }
      if (!inSummary && sense && SUMMARY_RE.test(t) && e.senses.length > 0) {
        const rest = b.lines.slice(i).map(l => l.t);
        // 仅当其后不再出现新例句时，才视为词尾总结
        if (!rest.some(x => NUMS.indexOf(x[0]) >= 0)) inSummary = true;
      }
      const note = classifyNote(t);
      if (inSummary) { e.summary.push(note); continue; }
      if (!sense) { e.head.push(note); continue; }
      if (note.t === "gloss" && !sense.translation) { sense.translation = note.text; continue; }
      sense.notes.push(note);
    }
    if (e.senses.length === 0) e.issues.push({ n: b.start, msg: "没有找到 ①②③ 例句" });
    e.senses.forEach(s => {
      if (!s.translation) e.issues.push({ n: b.start, msg: "例句 " + NUMS[s.no-1] + " 缺少以 = 开头的中文翻译" });
    });
    return e;
  }).filter(e => e.word);
}

/* -------------------------------------------------------- 高亮目标词 */
const SUFFIX_RE = /(ations?|ators?|ments?|nesses?|ities|ives?|ables?|ibles?|ances?|ences?|ings?|ers?|ors?|ies|ed|es|s|ly|y|e)$/;
function hlRegex(word) {
  const w = word.toLowerCase().split(/\s|-/)[0];
  let stem = w;
  const st = w.replace(SUFFIX_RE, "");
  if (st.length >= 5) stem = st;
  return new RegExp("\\b(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]{0,6})\\b", "gi");
}
function hl(sentence, word) {
  const out = esc(sentence);
  try { return out.replace(hlRegex(word), '<span class="hl">$1</span>'); }
  catch (e) { return out; }
}

/* ---------------------------------------------------------- 词条渲染 */
const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>';
// 签名元素：把 logo 的螺旋球画成进度环。done/total 是真实的组进度。
function ring(done, total, label) {
  const R = 19, C = 2 * Math.PI * R;
  const pct = total ? Math.max(0, Math.min(1, done / total)) : 0;
  return '<span class="ringwrap">' +
    '<svg class="ring" viewBox="0 0 44 44" aria-hidden="true">' +
      '<circle class="trk" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="2.5"/>' +
      '<circle class="arc" cx="22" cy="22" r="' + R + '" fill="none" stroke-width="2.5" ' +
        'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/>' +
    "</svg>" +
    "<b>" + esc(label != null ? label : done) + "</b></span>";
}
const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 3.1l2.63 5.33 5.87.86-4.25 4.14 1 5.85L12 16.52 6.75 19.28l1-5.85L3.5 9.29l5.87-.86z"/></svg>';
function starBtn(id, size) {
  const on = S.starred.has(id);
  return '<button class="star' + (on ? " on" : "") + '" data-star="' + id + '"' +
    ' aria-label="' + (on ? "取消收藏" : "收藏") + '" aria-pressed="' + on + '">' +
    STAR_SVG.replace("<svg", '<svg fill="' + (on ? "currentColor" : "none") +
                     '" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"') + "</button>";
}
async function toggleStar(id) {
  id = +id;
  if (S.starred.has(id)) {
    S.starred.delete(id);
    S.starredOrder = S.starredOrder.filter(x => x !== id);
    toast("已取消收藏");
  } else {
    S.starred.add(id);
    S.starredOrder.push(id);          // 数组顺序即收藏先后，不需要时间戳
    toast("已加入收藏夹");
  }
  await metaSet("starredIds", S.starredOrder);
  document.querySelectorAll('[data-star="' + id + '"]').forEach(b => {
    b.outerHTML = starBtn(id);
  });
  if (S.view === "fav") RENDER.fav();
}
window.toggleStar = toggleStar;
function spkBtn(text, kind) {
  return '<button class="spk' + (kind === "inline" ? " sm" : "") + '" data-say="' + esc(text) + '" aria-label="朗读">' + SPK_SVG + "</button>";
}
function renderNotes(notes) {
  if (!notes.length) return "";
  return '<div class="notes">' + notes.map(n => {
    if (n.t === "eq")    return '<div class="eq"><span class="lhs">' + esc(n.lhs) + '</span><span class="eqs">=</span><span class="rhs">' + esc(n.rhs) + "</span></div>";
    if (n.t === "gloss") return '<div class="n-gloss">' + esc(n.text) + "</div>";
    if (n.t === "label") return '<div class="n-label">' + esc(n.text) + "</div>";
    if (n.t === "en")    return '<div class="n-en">' + esc(n.text) + "</div>";
    return '<div class="n-text">' + esc(n.text) + "</div>";
  }).join("") + "</div>";
}
function renderWordFull(w) {
  // w.id 为空 = 导入预览里还没入库的词条，不显示星标
  let h = '<div class="wordhead"><div class="w">' + esc(w.word) + "</div>" +
          (w.id != null ? starBtn(w.id) : "") + spkBtn(w.word, "") + "</div>";
  if (w.head && w.head.length) h += renderNotes(w.head);
  w.senses.forEach(s => {
    h += '<div class="sense">' +
         '<p class="ex"><span class="snum">' + NUMS[s.no-1] + "</span> " + hl(s.example, w.word) +
         " " + spkBtn(s.example, "inline") + "</p>" +
         (s.translation ? '<p class="tr">' + esc(s.translation) + "</p>" : "") +
         renderNotes(s.notes) +
         "</div>";
  });
  if (w.summary && w.summary.length) h += '<div class="summary">' + renderNotes(w.summary) + "</div>";
  return h;
}
function renderWordQuiz(w) {
  let h = '<div class="wordhead"><div class="w">' + esc(w.word) + "</div>" +
          (w.id != null ? starBtn(w.id) : "") + spkBtn(w.word, "") + "</div>";
  w.senses.forEach(s => {
    h += '<div class="sense"><p class="ex"><span class="snum">' + NUMS[s.no-1] + "</span> " + hl(s.example, w.word) + "</p></div>";
  });
  return h;
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { toast("此设备不支持朗读"); }
}
window.speak = speak;
document.addEventListener("click", e => {
  if (!e.target.closest) return;
  const say = e.target.closest("[data-say]");
  if (say) { e.preventDefault(); speak(say.dataset.say); return; }
  const set = e.target.closest("[data-set]");
  if (set) { setSetting(set.dataset.set, set.dataset.num ? parseFloat(set.dataset.val) : set.dataset.val); return; }
  const st = e.target.closest("[data-star]");
  if (st) { e.preventDefault(); e.stopPropagation(); toggleStar(st.dataset.star); }
});

/* ---------------------------------------------------------- 导航外壳 */
function go(view, push = true) {
  if (push && S.view !== view) S.stack.push(S.view);
  S.view = view;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#v-" + view).classList.add("on");
  $("#backBtn").style.display = view === "home" ? "none" : "flex";
  window.scrollTo(0, 0);
  RENDER[view]();
}
function back() {
  const prev = S.stack.pop() || "home";
  go(prev, false);
}
$("#backBtn").onclick = back;
function setTitle(t, sub) {
  $("#ttl").innerHTML = esc(t) + (sub ? ' <span class="sub">' + esc(sub) + "</span>" : "");
}
function setAction(label, fn, accent) {
  const b = $("#actBtn");
  if (!label) { b.style.display = "none"; b.onclick = null; return; }
  b.style.display = "flex"; b.textContent = label; b.onclick = fn;
  b.className = "iconbtn" + (accent ? " accent" : "");
}

/* ============================== 首页 ============================== */
const RENDER = {};
RENDER.home = async function () {
  setTitle("背单词");
  setAction("设置", () => go("settings"));
  const today = todayKey();
  const q = quotaOpenGroups(), extra = extraDueGroups();
  const lg = learningGroup();
  const canNew = canStartNewGroup();
  const open = gateOpen();

  const total = S.nextSeq - 1;
  const mastered = S.groups.filter(g => g.state === "mastered").length;
  const reviewing = S.groups.filter(g => g.state === "reviewing").length;
  const pending = S.groups.filter(g => g.state === "pending").length;
  const learnedWords = S.groups.reduce((a, g) => a + (g.state === "learning" ? g.learnedCount : g.state === "pending" ? 0 : GROUP_SIZE), 0);

  let h = "";

  // 备份提醒
  if (total > 0) {
    const d = S.lastBackup ? daysBetween(S.lastBackup, today) : 999;
    if (d >= BACKUP_WARN_DAYS) {
      h += '<div class="banner"><div class="grow">' +
           (S.lastBackup ? "上次备份：" + d + " 天前" : "还没有备份过") +
           '<br><span class="hint">导出一份 JSON 到「文件」App，防止数据意外丢失</span></div>' +
           '<button onclick="exportBackup()">备份</button></div>';
    }
  }

  if (total === 0) {
    h += '<div class="empty">词库还是空的<br><br></div>' +
         '<button class="btn" onclick="go(\'import\')">导入词表</button>';
    $("#v-home").innerHTML = h;
    return;
  }

  /* --- 今日复习 --- */
  h += '<div class="eyebrow">今日复习</div>';
  if (q.length === 0 && extra.length === 0) {
    h += '<div class="card"><div class="title" style="color:var(--green-text)">今天没有到期的复习 ✓</div>' +
         '<div class="meta">背诵已解锁</div></div>';
  } else {
    const totalWords = q.length * GROUP_SIZE;
    h += '<div class="card" style="background:var(--green-wash)"><div class="title">' +
         (q.length ? "还有 " + q.length + " 组 · " + totalWords + " 词" : "今日任务已完成 ✓") +
         "</div>" +
         '<div class="meta">' + (q.length
            ? "完成后解锁背诵新词" + (extra.length ? "；另有 " + extra.length + " 组逾期排队中" : "")
            : (extra.length ? "另有 " + extra.length + " 组逾期，可选做" : "")) + "</div></div>";
    q.forEach(g => {
      const over = daysBetween(g.nextReviewDate, today);
      const sess = g.reviewSession && g.reviewSession.date === today && !g.reviewSession.done ? g.reviewSession : null;
      h += '<button class="rowbtn" onclick="startReview(' + g.id + ')">' +
           ring(g.reviewStage, INTERVALS.length, "R" + (g.reviewStage + 1)) + '<div class="grow">' +
           '<div class="title">组 #' + g.id + "</div>" +
           '<div class="meta">' + (over > 0 ? "逾期 " + over + " 天" : "今日到期") +
           (sess ? "　· 已续存进度" : "") + "</div></div><div class=\"chev\">›</div></button>";
    });
    if (extra.length) {
      h += '<div class="hint" style="margin:6px 2px 12px">超出今日配额（' + DAILY_CAP + ' 组）的逾期组不计入解锁条件，可自愿加做：</div>';
      extra.slice(0, 20).forEach(g => {
        h += '<button class="rowbtn" style="background:none;border:1px solid var(--line)" onclick="startReview(' + g.id + ')"><div class="grow">' +
             '<div class="title">组 #' + g.id + '</div><div class="meta">逾期 ' + daysBetween(g.nextReviewDate, today) + ' 天</div></div><div class="chev">›</div></button>';
      });
    }
  }

  /* --- 背诵 --- */
  h += '<div class="eyebrow">背诵新词</div>';
  if (lg) {
    if (open) {
      h += '<button class="rowbtn" onclick="startLearn(' + lg.id + ')">' +
           ring(lg.learnedCount, GROUP_SIZE) + '<div class="grow">' +
           '<div class="title">继续背诵 · 组 #' + lg.id + "</div>" +
           '<div class="meta">已标记 ' + lg.learnedCount + " / " + GROUP_SIZE + " 词</div>" +
           "</div><div class=\"chev\">›</div></button>";
    } else {
      h += '<div class="rowbtn locked"><div class="grow"><div class="title" style="color:var(--fg-muted)">🔒 组 #' + lg.id + ' · 已标记 ' + lg.learnedCount + "/" + GROUP_SIZE + "</div>" +
           '<div class="meta">今日复习未完成，背诵已锁定</div></div></div>';
    }
  } else if (canNew.ok) {
    const next = S.groups.find(g => g.state === "pending");
    h += '<button class="rowbtn" onclick="startLearn(' + next.id + ')"><div class="grow">' +
         '<div class="title">开始新的一组 · 组 #' + next.id + "</div>" +
         '<div class="meta">' + GROUP_SIZE + " 个新词</div></div><div class=\"chev\">›</div></button>";
  } else {
    const msg = {
      gate:  "🔒 今日复习未完成，背诵已锁定",
      daily: "✓ 今天的新词额度已用完（每天 1 组）",
      empty: "词库里没有待背的完整组了",
    }[canNew.why] || "";
    const sub = {
      gate:  "先把上面的复习做完",
      daily: "明天凌晨 4:00 后可以开新组",
      empty: S.looseIds.length > 0 ? "暂存区还有 " + S.looseIds.length + " 个词，凑满 " + GROUP_SIZE + " 个即可成组" : "去导入更多词表",
    }[canNew.why] || "";
    h += '<div class="rowbtn locked"><div class="grow"><div class="title" style="color:var(--fg-muted)">' + msg + "</div>" +
         '<div class="meta">' + sub + "</div></div></div>";
  }

  /* --- 总览 --- */
  h += '<div class="eyebrow">总览</div><div class="stats">' +
       '<div class="stat g"><b>' + mastered + "</b><span>已掌握组</span></div>" +
       '<div class="stat"><b>' + reviewing + "</b><span>复习中组</span></div>" +
       '<div class="stat"><b>' + pending + "</b><span>待背组</span></div>" +
       '<div class="stat"><b>' + total + "</b><span>词库总量</span></div>" +
       "</div>" +
       '<div class="hint" style="margin-top:10px">已背 ' + learnedWords + " 词　·　暂存区 " + S.looseIds.length + " 词（凑满 " + GROUP_SIZE + " 自动成组）</div>";

  /* --- 词库管理 --- */
  h += '<div class="eyebrow">词库</div>' +
       '<button class="rowbtn" onclick="go(\'fav\')"><div class="grow"><div class="title">收藏夹</div><div class="meta">' +
         (S.starredOrder.length ? S.starredOrder.length + ' 个反复忘记或特别难的词' : '还没有收藏任何词') + '</div></div><div class="chev">›</div></button>' +
       '<button class="rowbtn" onclick="go(\'search\')"><div class="grow"><div class="title">搜索单词</div><div class="meta">在全部 ' + total + ' 词中查找</div></div><div class="chev">›</div></button>' +
       '<button class="rowbtn" onclick="go(\'groups\')"><div class="grow"><div class="title">组列表</div><div class="meta">' + S.groups.length + ' 组 · 按状态浏览</div></div><div class="chev">›</div></button>' +
       '<button class="rowbtn" onclick="go(\'import\')"><div class="grow"><div class="title">导入词表</div><div class="meta">.txt 文件或粘贴文本</div></div><div class="chev">›</div></button>';

  $("#v-home").innerHTML = h;
};

/* ============================== 背诵 ============================== */
let LS = null;   // {group, words, idx}
async function startLearn(gid) {
  const g = groupById(gid);
  if (!gateOpen()) { toast("今日复习未完成，背诵已锁定"); return; }
  if (g.state === "pending") {
    if (!canStartNewGroup().ok) { toast("今天已经开过新的一组了"); return; }
    g.state = "learning"; g.startedAt = todayKey(); g.learnSession = { idx: 0 };
    S.lastNewGroupDate = todayKey();
    S.lastNewGroupId = g.id;
    await metaSet("lastNewGroupDate", S.lastNewGroupDate);
    await metaSet("lastNewGroupId", S.lastNewGroupId);
    await req(store("groups", "readwrite").put(g));
  }
  const words = await getWords(g.wordIds);
  LS = { group: g, words, idx: (g.learnSession && g.learnSession.idx) || 0 };
  if (LS.idx >= words.length) LS.idx = 0;
  go("learn");
}
window.startLearn = startLearn;

RENDER.learn = function () {
  if (!LS) { go("home", false); return; }
  const { group: g, words, idx } = LS;
  const w = words[idx];
  setTitle("组 #" + g.id, (idx + 1) + " / " + words.length);
  setAction("列表", () => openGroup(g.id));

  let h = '<div class="navrow">' +
    '<button onclick="learnStep(-1)"' + (idx === 0 ? " disabled" : "") + ">‹ 上一个</button>" +
    '<span>已标记 ' + g.learnedCount + "/" + words.length + "</span>" +
    '<button onclick="learnStep(1)"' + (idx === words.length - 1 ? " disabled" : "") + ">下一个 ›</button></div>" +
    '<div class="progressbar" style="margin-bottom:22px"><i style="width:' + (g.learnedCount / words.length * 100) + '%"></i></div>' +
    '<div class="sheet" id="cardhost">' + renderWordFull(w) + "</div>" +
    '<div class="footerbar">' +
    '<button class="btn markbtn' + (w.learned ? " done" : "") + '" onclick="toggleMark()">' +
      (w.learned ? "✓ 已背下" : "标记为已背下") + "</button></div>";
  $("#v-learn").innerHTML = h;
};

function learnStep(d) {
  const n = LS.idx + d;
  if (n < 0 || n >= LS.words.length) return;
  LS.idx = n;
  LS.group.learnSession = { idx: n };
  req(store("groups", "readwrite").put(LS.group));
  RENDER.learn();
}
window.learnStep = learnStep;

async function toggleMark() {
  const w = LS.words[LS.idx], g = LS.group;
  w.learned = !w.learned;
  w.learnedAt = w.learned ? todayKey() : null;
  await putWord(w);
  g.learnedCount = LS.words.filter(x => x.learned).length;

  if (g.learnedCount === GROUP_SIZE && g.state === "learning") {
    g.state = "reviewing";
    g.completedAt = todayKey();
    g.reviewStage = 0;
    g.nextReviewDate = addDays(g.completedAt, INTERVALS[0]);
    g.reviewSession = null;
    g.learnSession = null;
    await req(store("groups", "readwrite").put(g));
    await refreshQuota();
    $("#v-learn").innerHTML =
      '<div class="empty" style="padding-top:64px"><div style="font-size:3em;line-height:1.4">✓</div>' +
      '<div style="color:var(--green-text);font-weight:600;font-size:1.25em;margin-bottom:8px">组 #' + g.id + " 已背诵完成</div>" +
      "<div>50 个词全部标记完毕<br>已加入复习清单，下次复习：" + g.nextReviewDate + "（" + INTERVALS[0] + " 天后）</div></div>" +
      '<button class="btn" onclick="go(\'home\',false)">回到首页</button>';
    setAction("");
    LS = null;
    return;
  }
  await req(store("groups", "readwrite").put(g));
  // 标记后自动前进
  if (w.learned && LS.idx < LS.words.length - 1) { learnStep(1); return; }
  RENDER.learn();
}
window.toggleMark = toggleMark;

/* ============================== 复习 ============================== */
let RS = null;  // {group, map, sess}
async function startReview(gid) {
  const g = groupById(gid);
  const today = todayKey();
  const words = await getWords(g.wordIds);
  const map = {}; words.forEach(w => map[w.id] = w);
  let sess = g.reviewSession;
  if (!sess || sess.date !== today || sess.done) {
    sess = { date: today, round: 1, queue: shuffle(g.wordIds), idx: 0, again: [], revealed: false, done: false };
    g.reviewSession = sess;
    await req(store("groups", "readwrite").put(g));
  }
  sess.revealed = false;
  RS = { group: g, map, sess };
  go("review");
}
window.startReview = startReview;

RENDER.review = function () {
  if (!RS) { go("home", false); return; }
  const { group: g, map, sess } = RS;
  const w = map[sess.queue[sess.idx]];
  if (!w) { finishRound(); return; }
  setTitle("复习 · 组 #" + g.id, "第 " + sess.round + " 轮 · " + (sess.idx + 1) + "/" + sess.queue.length);
  setAction("");

  let h = '<div class="progressbar" style="margin-bottom:22px"><i style="width:' + ((sess.idx) / sess.queue.length * 100) + '%"></i></div>';
  if (sess.revealed) {
    h += '<div class="sheet reveal">' + renderWordFull(w) + "</div>" +
         '<div class="footerbar"><button class="btn dark" onclick="reviewNext(false)">继续 ›</button></div>';
  } else {
    h += '<div class="sheet">' + renderWordQuiz(w) + "</div>" +
         '<div class="footerbar">' +
         '<button class="btn ghost" onclick="reviewForgot()">记不清</button>' +
         '<button class="btn" onclick="reviewNext(true)">还记得</button></div>';
  }
  $("#v-review").innerHTML = h;
};

function reviewForgot() {
  const { sess, map } = RS;
  const id = sess.queue[sess.idx];
  sess.again.push(id);
  sess.revealed = true;
  const w = map[id];                       // 记录忘记次数，收藏夹按它排序
  if (w) { w.forgotCount = (w.forgotCount || 0) + 1; putWord(w); }
  persistReview();
  RENDER.review();
}
window.reviewForgot = reviewForgot;

function reviewNext() {
  const { sess } = RS;
  sess.revealed = false;
  sess.idx++;
  if (sess.idx >= sess.queue.length) { finishRound(); return; }
  persistReview();
  RENDER.review();
}
window.reviewNext = reviewNext;

function persistReview() {
  RS.group.reviewSession = RS.sess;
  req(store("groups", "readwrite").put(RS.group));
}

async function finishRound() {
  const { group: g, sess } = RS;
  if (sess.again.length) {
    sess.round++;
    sess.queue = shuffle(sess.again);
    sess.again = [];
    sess.idx = 0;
    sess.revealed = false;
    persistReview();
    $("#v-review").innerHTML =
      '<div class="empty" style="padding-top:56px"><div style="font-size:1.2em;color:var(--ink);font-weight:600;margin-bottom:8px">第 ' + (sess.round - 1) + ' 轮结束</div>' +
      "<div>还有 " + sess.queue.length + " 个词没记牢，再过一遍</div></div>" +
      '<button class="btn" onclick="RENDER.review()">开始第 ' + sess.round + " 轮</button>";
    return;
  }
  // 整组今日复习完成
  sess.done = true;
  g.reviewStage++;
  g.lastReviewedDate = todayKey();
  let msg;
  if (g.reviewStage >= INTERVALS.length) {
    g.state = "mastered";
    g.nextReviewDate = null;
    msg = "组 #" + g.id + " 已掌握 🎉<br><span style=\"color:var(--fg-muted)\">走完全部 " + INTERVALS.length + " 轮复习，已归档</span>";
  } else {
    g.nextReviewDate = addDays(g.completedAt, INTERVALS[g.reviewStage]);
    msg = "组 #" + g.id + " 今日复习完成<br><span style=\"color:var(--fg-muted)\">下次复习：" + g.nextReviewDate +
          "（第 " + (g.reviewStage + 1) + "/" + INTERVALS.length + " 轮）</span>";
  }
  g.reviewSession = sess;
  await req(store("groups", "readwrite").put(g));
  const remain = quotaOpenGroups().length;
  $("#v-review").innerHTML =
    '<div class="empty" style="padding-top:56px"><div style="font-size:3em;line-height:1.4;color:var(--green-text)">✓</div>' +
    '<div style="color:var(--ink);font-weight:600;font-size:1.2em;margin-bottom:8px">' + msg + "</div>" +
    "<div>" + (remain ? "今日还剩 " + remain + " 组待复习" : "🔓 今日复习全部完成，背诵已解锁") + "</div></div>" +
    '<button class="btn" onclick="go(\'home\',false)">回到首页</button>';
  setTitle("复习完成");
  RS = null;
}

  h += '<div class="grid">' + list.map(g => {
    const due = g.state === "reviewing" && g.nextReviewDate <= today;
    const label = g.state === "pending" ? "待背"
                : g.state === "learning" ? g.learnedCount + "/" + GROUP_SIZE
                : g.state === "mastered" ? "已掌握"

function setGTab(k) { GTAB = k; RENDER.groups(); }
function openGroup(id) { GLIST = id; go("grouplist"); }
window.setGTab = setGTab; window.openGroup = openGroup;
RENDER.grouplist = async function () {

    reviewing: [ring(g.reviewStage, INTERVALS.length, "R" + (g.reviewStage + 1)), "复习中",
                "背完于 " + g.completedAt + "　·　下次复习 " + g.nextReviewDate],
    mastered:  [ring(1, 1, "✓"), "已掌握", "走完全部 " + INTERVALS.length + " 轮复习"],
    pending:   [ring(0, GROUP_SIZE, "0"), "尚未开始", GROUP_SIZE + " 个词等待背诵"],
  }[g.state];
  h += '<div style="display:flex;align-items:center;gap:15px">' + head[0] +

  h += "</div>";

  if (g.state === "mastered")  h += '<button class="btn ghost" style="margin-bottom:14px" onclick="startReview(' + g.id + ')">手动重温这一组</button>';

  h += '<div class="eyebrow">' + words.length + " 个词</div>";
  h += words.map(w => '<button class="listitem" style="width:100%;text-align:left" onclick="openWordPlain(' + w.id + ')">' +
        '<span class="dot' + (w.learned ? " on" : "") + '"></span>' +
        '<span class="w">' + esc(w.word) + "</span>" +
        '<span class="t">' + esc((w.senses[0] && w.senses[0].translation) || "") + "</span></button>").join("");
  $("#v-grouplist").innerHTML = h;
};

async function resetGroup(gid) {
  if (!confirm("重置组 #" + gid + "？\n\n该组的全部标记和复习进度会清空，回到「待背」状态，并退出复习队列。此操作不可撤销。")) return;
  const g = groupById(gid);
  const words = await getWords(g.wordIds);
  const wt = tx(["words"], "readwrite").objectStore("words");
  words.forEach(w => { w.learned = false; w.learnedAt = null; wt.put(w); });
  await new Promise(res => { wt.transaction.oncomplete = res; });
  g.state = "pending"; g.learnedCount = 0; g.reviewStage = 0;
  g.completedAt = null; g.nextReviewDate = null; g.reviewSession = null; g.learnSession = null;
  // 重置的如果正是今天消耗掉额度的那一组，把额度退回来 ——
  // 否则会卡死：既不能重背这一组，也不能开新组。
  // 只退这一组，重置旧组不会凭空变出今天的额度。
  let refunded = false;
  if (S.lastNewGroupDate === todayKey() && S.lastNewGroupId === g.id) {
    S.lastNewGroupDate = ""; S.lastNewGroupId = null;
    await metaSet("lastNewGroupDate", ""); await metaSet("lastNewGroupId", null);
    refunded = true;
  }
  await req(store("groups", "readwrite").put(g));
  await refreshQuota();
  toast("组 #" + gid + " 已重置" + (refunded ? "，今日新组额度已退回" : ""));
  RENDER.grouplist();
}
window.resetGroup = resetGroup;

/* ============================== 搜索 ============================== */
RENDER.search = function () {
  setTitle("搜索");
  setAction("");
  $("#v-search").innerHTML =
    '<input class="searchbox" id="q" placeholder="输入单词开头，如 accum" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div id="results"><div class="hint">按前缀匹配，最多显示 60 条。</div></div>';
  const q = $("#q");
  q.oninput = () => doSearch(q.value.trim().toLowerCase());
  setTimeout(() => q.focus(), 60);
};
let searchTimer;
function doSearch(p) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    if (!p) { $("#results").innerHTML = '<div class="hint">按前缀匹配，最多显示 60 条。</div>'; return; }
    const idx = store("words").index("by_word");
    const range = IDBKeyRange.bound(p, p + "￿");
    const out = [];
    await new Promise(res => {
      const c = idx.openCursor(range);
      c.onsuccess = e => {
        const cur = e.target.result;
        if (!cur || out.length >= 60) return res();
        out.push(cur.value); cur.continue();
      };
      c.onerror = () => res();
    });
    $("#results").innerHTML = out.length
      ? out.map(w => '<button class="listitem" style="width:100%;text-align:left" onclick="openWordPlain(' + w.id + ')">' +
          '<span class="dot' + (w.learned ? " on" : "") + '"></span><span class="w">' + esc(w.word) + "</span>" +
          '<span class="t">' + esc((w.senses[0] && w.senses[0].translation) || "") + "</span></button>").join("")
      : '<div class="empty">没有找到「' + esc(p) + "」</div>";
  }, 140);
}

/* ============================ 收藏夹 ============================ */
let FAVSORT = "recent";                    // recent | forgot | group
let FAVNAV = [];                           // 详情页在收藏夹内翻页用的 id 序列
function setFavSort(k) { FAVSORT = k; RENDER.fav(); }
window.setFavSort = setFavSort;

RENDER.fav = async function () {
  setTitle("收藏夹", S.starredOrder.length + " 词");
  setAction("");
  if (!S.starredOrder.length) {
    FAVNAV = [];
    $("#v-fav").innerHTML =
      '<div class="empty">收藏夹还是空的<br><br>' +
      "在单词卡片右上角点星标，把反复忘记或特别难的词收进来</div>";
    return;
  }
  let words = await getWords(S.starredOrder);
  const pos = {};                          // 数组顺序 = 收藏先后，省掉时间戳字段
  S.starredOrder.forEach((id, i) => pos[id] = i);
  if (FAVSORT === "recent")      words.sort((a, b) => pos[b.id] - pos[a.id]);
  else if (FAVSORT === "forgot") words.sort((a, b) => (b.forgotCount || 0) - (a.forgotCount || 0) || pos[b.id] - pos[a.id]);
  else                           words.sort((a, b) => (a.groupId || 0) - (b.groupId || 0) || a.seq - b.seq);
  FAVNAV = words.map(w => w.id);

  const tabs = [["recent", "最近收藏"], ["forgot", "忘得最多"], ["group", "按组顺序"]];
  let h = '<div class="tabs">' + tabs.map(([k, l]) =>
    '<button class="' + (FAVSORT === k ? "on" : "") + '" onclick="setFavSort(\'' + k + '\')">' + l + "</button>").join("") + "</div>";

  h += words.map(w => {
    const n = w.forgotCount || 0;
    return '<div class="listitem">' +
      starBtn(w.id) +
      '<button class="w" style="text-align:left;background:none;flex:1;min-width:0" onclick="openFav(' + w.id + ')">' + esc(w.word) + "</button>" +
      '<span class="t">' + esc((w.senses[0] && w.senses[0].translation) || "") + "</span>" +
      '<span class="favmeta">#' + (w.groupId || "—") + (n ? "　忘 " + n : "") + "</span></div>";
  }).join("");
  $("#v-fav").innerHTML = h;
};
function openFav(id) { openWord(id); }
window.openFav = openFav;

/* ============================ 单词详情 ============================ */
let WORDID = null;
async function openWord(id) { WORDID = id; WEDIT = false; go("word"); }
// 从组详情/搜索进来时不带收藏夹翻页上下文
function openWordPlain(id) { FAVNAV = []; openWord(id); }
window.openWordPlain = openWordPlain;
window.openWord = openWord;
let WEDIT = false;
RENDER.word = async function () {
  const w = await getWord(WORDID);
  if (!w) { back(); return; }
  setTitle("组 #" + (w.groupId || "—"), w.learned ? "已背下" : "未标记");
  if (WEDIT) {
    setAction("取消", () => { WEDIT = false; RENDER.word(); });
    $("#v-word").innerHTML =
      '<div class="hint" style="margin-bottom:10px">编辑原始文本，保存后按同样的规则重新解析。</div>' +
      '<textarea class="ta" id="wraw" style="min-height:300px">' + esc(w.raw) + "</textarea>" +
      '<button class="btn" style="margin-top:12px" onclick="saveWord()">保存并重新解析</button>';
  } else {
    setAction("编辑", () => { WEDIT = true; RENDER.word(); });
    const i = FAVNAV.indexOf(WORDID);
    const nav = i < 0 ? "" :
      '<div class="navrow" style="margin-bottom:14px">' +
      '<button onclick="favStep(-1)"' + (i === 0 ? " disabled" : "") + ">‹ 上一个</button>" +
      '<span>收藏夹 ' + (i + 1) + " / " + FAVNAV.length + "</span>" +
      '<button onclick="favStep(1)"' + (i === FAVNAV.length - 1 ? " disabled" : "") + ">下一个 ›</button></div>";
    $("#v-word").innerHTML = nav + '<div class="sheet">' + renderWordFull(w) + "</div>";
  }
};
function favStep(d) {
  const i = FAVNAV.indexOf(WORDID) + d;
  if (i < 0 || i >= FAVNAV.length) return;
  WORDID = FAVNAV[i];
  window.scrollTo(0, 0);
  RENDER.word();
}
window.favStep = favStep;

async function saveWord() {
  const v = $("#wraw").value;
  const parsed = parseVocab(v)[0];
  if (!parsed) { toast("解析失败，未保存"); return; }
  if (parsed.issues.length) { if (!confirm("这个词条有格式问题：\n" + parsed.issues.map(i => i.msg).join("\n") + "\n\n仍然保存？")) return; }
  const w = await getWord(WORDID);
  Object.assign(w, {
    word: parsed.word, wordKey: parsed.word.toLowerCase(),
    senses: parsed.senses, summary: parsed.summary, head: parsed.head, raw: parsed.raw,
  });
  try { await putWord(w); } catch (e) { toast("保存失败：可能与已有单词重名"); return; }
  WEDIT = false;
  toast("已保存");
  RENDER.word();
}
window.saveWord = saveWord;

function pickFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => checkText(r.result);
  r.onerror = () => toast("读取文件失败");
  r.readAsText(f, "utf-8");
}
window.pickFile = pickFile;

async function checkText(text) {
  if (!text || !text.trim()) { toast("内容是空的"); return; }
  const entries = parseVocab(text);
  if (!entries.length) { toast("没有解析出任何词条"); return; }

  // 去重（静默防线）：批内去重 + 与词库比对，全部在同一个事务里发起
  const dupes = [];
  const seen = new Set();
  const uniq = [];
  for (const e of entries) {
    const key = e.word.toLowerCase();
    if (seen.has(key)) { dupes.push(e.word); continue; }
    seen.add(key);
    uniq.push(e);
  }
  const idx = store("words").index("by_word");
  const hits = await Promise.all(uniq.map(e => req(idx.getKey(e.word.toLowerCase()))));
  const fresh = [];
  uniq.forEach((e, i) => { if (hits[i] === undefined) fresh.push(e); else dupes.push(e.word); });
  const issues = entries.filter(e => e.issues.length);
  PENDING = fresh;

  const newGroups = Math.floor((S.looseIds.length + fresh.length) / GROUP_SIZE);
  let h = '<div class="eyebrow">解析结果</div><div class="card">' +
    '<div class="title">共识别 ' + entries.length + " 个词条</div>" +
    '<div class="meta">可新增 <b style="color:var(--green-text)">' + fresh.length + "</b> 个" +
    (dupes.length ? "　·　跳过重复 " + dupes.length + " 个" : "") +
    (issues.length ? '　·　<span style="color:var(--danger)">' + issues.length + " 个有格式问题</span>" : "") +
    "</div><div class=\"meta\">导入后可成组：<b>" + newGroups + "</b> 组，暂存区剩 " +
    ((S.looseIds.length + fresh.length) % GROUP_SIZE) + " 词</div></div>";

  if (issues.length) {
    h += '<div class="eyebrow">格式问题（仍可导入，但建议先修）</div>';
    issues.slice(0, 40).forEach(e => {
      e.issues.forEach(i => { h += '<div class="issue"><b>第 ' + i.n + " 行</b>　" + esc(i.msg) + "</div>"; });
    });
    if (issues.length > 40) h += '<div class="hint">…还有 ' + (issues.length - 40) + " 个词条有问题</div>";
  }
  if (dupes.length) {
    h += '<div class="eyebrow">跳过的重复词（' + dupes.length + "）</div>" +
         '<div class="card flat hint" style="font-family:var(--serif)">' + dupes.slice(0, 120).map(esc).join("、") +
         (dupes.length > 120 ? " …" : "") + "</div>";
  }
  h += '<div class="eyebrow">预览（前 3 条）</div>';
  fresh.slice(0, 3).forEach(e => { h += '<div class="card">' + renderWordFull(e) + "</div>"; });
  h += '<button class="btn" style="margin-top:12px" onclick="commitImport()">确认导入 ' + fresh.length + " 个词</button>";
  $("#report").innerHTML = h;
  $("#report").scrollIntoView({ behavior: "smooth", block: "start" });
}
window.checkText = checkText;

async function commitImport() {
  if (!PENDING || !PENDING.length) { toast("没有可导入的词"); return; }
  const t = tx(["words"], "readwrite");
  const ws = t.objectStore("words");
  let seq = S.nextSeq;
  const newIds = [];
  for (const e of PENDING) {
    ws.put({
      id: seq, seq,
      word: e.word,                       // 展示用原文
      wordKey: e.word.toLowerCase(),      // 索引 / 去重 / 搜索键
      senses: e.senses, summary: e.summary, head: e.head, raw: e.raw,
      groupId: null, learned: false, learnedAt: null,
    });
    newIds.push(seq);
    seq++;
  }
  await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
  S.nextSeq = seq;
  S.looseIds = S.looseIds.concat(newIds);
  await metaSet("nextSeq", seq);
  const made = await formGroups();
  await metaSet("looseIds", S.looseIds);
  PENDING = null;
  await refreshQuota();
  toast("导入 " + newIds.length + " 词，新成 " + made + " 组");
  go("home", false);
}
window.commitImport = commitImport;

// 把暂存区的词按 seq 顺序切成整 50 的组（不足 50 的留在暂存区）
async function formGroups() {
  let nextGid = S.groups.length ? Math.max.apply(null, S.groups.map(g => g.id)) + 1 : 1;
  let made = 0;
  while (S.looseIds.length >= GROUP_SIZE) {
    const ids = S.looseIds.splice(0, GROUP_SIZE);
    const words = await getWords(ids);                       // 事务 1：读
    const g = {
      id: nextGid++, wordIds: ids, state: "pending",
      learnedCount: 0, startedAt: null, completedAt: null,
      reviewStage: 0, nextReviewDate: null, reviewSession: null, learnSession: null,
    };
    const t = tx(["words", "groups"], "readwrite");           // 事务 2：写
    const ws = t.objectStore("words");
    words.forEach(w => { w.groupId = g.id; ws.put(w); });
    t.objectStore("groups").put(g);
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    S.groups.push(g);
    made++;
  }
  S.groups.sort((a, b) => a.id - b.id);
  return made;
}

function setSetting(k, v) { S.settings[k] = v; saveSettings(); RENDER.settings(); }
window.setSetting = setSetting;

async function exportBackup() {
  toast("正在生成备份…");
  const groups = await req(store("groups").getAll());
  const meta = await req(store("meta").getAll());
  // 词库用游标分块序列化，避免一次性把 10 万条记录全部装进内存
  const parts = ['{"v":1,"exportedAt":"' + new Date().toISOString() + '"' +
                 ',"settings":' + JSON.stringify(S.settings) +
                 ',"groups":' + JSON.stringify(groups) +
                 ',"meta":' + JSON.stringify(meta) +
                 ',"words":['];
  let buf = [], firstChunk = true;
  await new Promise((res, rej) => {
    const c = store("words").openCursor();
    c.onsuccess = e => {
      const cur = e.target.result;
      if (!cur) {
        if (buf.length) { parts.push((firstChunk ? "" : ",") + buf.join(",")); }
        return res();
      }
      buf.push(JSON.stringify(cur.value));
      if (buf.length >= 500) {
        parts.push((firstChunk ? "" : ",") + buf.join(","));
        firstChunk = false; buf = [];
      }
      cur.continue();
    };
    c.onerror = () => rej(c.error);
  });
  parts.push("]}");
  const blob = new Blob(parts, { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "背单词备份-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.lastBackup = todayKey();
  await metaSet("lastBackup", S.lastBackup);
  toast("备份已导出（" + fmtSize(blob.size) + "）");
}
window.exportBackup = exportBackup;

function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let p;
    try { p = JSON.parse(r.result); } catch (err) { toast("不是合法的备份文件"); return; }
    if (!p.words || !p.groups) { toast("备份文件格式不对"); return; }
    if (!confirm("导入备份会【覆盖】当前全部数据（" + (S.nextSeq - 1) + " 词）。\n备份含 " + p.words.length + " 词、" + p.groups.length + " 组。\n\n确定继续？")) return;
    const t = tx(["words", "groups", "meta"], "readwrite");
    t.objectStore("words").clear(); t.objectStore("groups").clear(); t.objectStore("meta").clear();
    p.words.forEach(w => t.objectStore("words").put(w));
    p.groups.forEach(g => t.objectStore("groups").put(g));
    (p.meta || []).forEach(m => t.objectStore("meta").put(m));
    await new Promise(res => { t.oncomplete = res; });
    if (p.settings) { S.settings = p.settings; saveSettings(); }
    await loadState();
    toast("备份已恢复");
    go("home", false);
  };
  r.readAsText(f, "utf-8");
}
window.importBackup = importBackup;

async function wipeAll() {
  if (!confirm("清空全部数据？\n\n词库、进度、复习记录都会被删除，无法撤销。建议先导出备份。")) return;
  if (!confirm("再确认一次：真的要清空吗？")) return;
  const t = tx(["words", "groups", "meta"], "readwrite");
  t.objectStore("words").clear(); t.objectStore("groups").clear(); t.objectStore("meta").clear();
  await new Promise(res => { t.oncomplete = res; });
  await loadState();
  toast("已清空");
  go("home", false);
}
window.wipeAll = wipeAll;

// 触摸滑动切换背诵卡片
let tx0 = 0, ty0 = 0;
document.addEventListener("touchstart", e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (S.view !== "learn" || !LS) return;
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) learnStep(dx < 0 ? 1 : -1);
}, { passive: true });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applySettings);

if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            toast("已下载新版本，下次打开生效");
          }
        });
      });
    }).catch(() => {});
  });
}

(async function boot() {
  loadSettings();
  try {
    await openDB();
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
    await loadState();
    go("home", false);
  } catch (e) {
    document.querySelector("main").innerHTML =
      '<div class="empty">数据库打开失败<br><br>' + esc(e && e.message || e) + "</div>";
  }
})();
